name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional: version to release, for example 1.0.1. Leave empty for the next automatic number.'
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Work out the version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          V="$INPUT_VERSION"
          if [ -z "$V" ]; then V="1.0.$RUN_NUMBER"; fi
          V="${V#v}"
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The version must look like 1.0.1"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set the app version
        working-directory: app
        shell: bash
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build the engine
        working-directory: app
        shell: cmd
        run: |
          python -m pip install -q pyinstaller
          python -m PyInstaller --noconfirm --clean --log-level WARN --onefile --console --name FortniteUnityPorter --distpath engine\bin --workpath build_py --specpath build_py --exclude-module tkinter --exclude-module unittest --exclude-module pydoc --exclude-module doctest --exclude-module sqlite3 --exclude-module xmlrpc --exclude-module lib2to3 --exclude-module curses --exclude-module turtle --exclude-module idlelib engine\FortniteUnityPorter.py

      - name: Build the file helper
        working-directory: app
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File helper\build-helper.ps1

      - name: Build the app
        working-directory: app
        shell: bash
        run: |
          npm install --no-audit --no-fund --loglevel=error
          npm run pack
          ls -la dist

      - name: Write the release notes
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v$VERSION"
          PREV="$( (git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$TAG" | head -n 1) || true)"
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="-n 15"; fi
          # one line per change: the title of each commit since the previous release
          (git log --no-merges --format='%s' $RANGE | grep -viE '^(readme|merge|workflow|ci[: ])' | sed 's/^/- /' > release-notes.txt) || true
          if [ ! -s release-notes.txt ]; then echo "- Small fixes and improvements" > release-notes.txt; fi
          cat release-notes.txt

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          FILE="$( (ls app/dist/*.exe 2>/dev/null || true) | (grep -v -i -E 'setup|installer|uninstall' || true) | head -n 1)"
          if [ -z "$FILE" ]; then
            FOUND="$( (find app -maxdepth 3 \( -name '*.exe' -o -name 'dist' \) -not -path '*/node_modules/*' 2>&1 || true) | tr '\n' ' ')"
            DIST="$( (ls -la app/dist 2>&1 || true) | tr '\n' ' ')"
            echo "::error::No exe in app/dist. Found: $FOUND || dist: $DIST"
            exit 1
          fi
          echo "Publishing $FILE as $TAG"
          if OUT=$(gh release create "$TAG" "$FILE" --title "$TAG" --notes-file release-notes.txt --target "${GITHUB_SHA}" 2>&1); then
            echo "$OUT"
          else
            echo "::warning::release create failed: $(echo "$OUT" | tr '\n' ' ')"
            if OUT2=$(gh release upload "$TAG" "$FILE" --clobber 2>&1); then
              echo "$OUT2"
            else
              echo "::error::release upload failed: $(echo "$OUT2" | tr '\n' ' ')"
              exit 1
            fi
          fi
