<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>Fortnite Unity Converter</title>
<style>
@font-face{font-family:'SF Pro Text';font-weight:400;src:url('../assets/fonts/SF-Pro-Text-Regular.otf');}
@font-face{font-family:'SF Pro Text';font-weight:600;src:url('../assets/fonts/SF-Pro-Text-Semibold.otf');}
@font-face{font-family:'SF Pro Text';font-weight:700;src:url('../assets/fonts/SF-Pro-Text-Bold.otf');}
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0D0C12;--card:#181620;--card2:#16141E;--border-hi:#2F2D3C;--btn:#1D1B24;--btn-hover:#252332;--primary:#953bf8;--primary-hover:#a65cf9;--text:#E2DFF0;--muted:#A8A4C0;--dim:#686490;--ok:#3ddc97;
  --card-shadow:inset 0 3px 2px -2px #ffffff10,inset 0 10px 25px #ffffff05,inset 0 0 0 1.5px #ffffff0a,0 4px 8px #00000020,0 8px 12px #00000010;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'SF Pro Text','Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;user-select:none;overflow:hidden;}
.panel{width:100%;max-width:380px;text-align:center;padding:28px 24px 24px;background:linear-gradient(var(--card),var(--card2));border:1px solid var(--border-hi);border-radius:16px;box-shadow:0 6px 14px #0007,0 24px 60px #000b;animation:up .35s cubic-bezier(.22,1,.36,1) both;}
.logo{width:64px;height:64px;margin-bottom:14px;filter:drop-shadow(0 0 18px #953bf855);}
.app{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.app b{color:var(--primary);font-weight:700;}
.icon{width:44px;height:44px;border-radius:50%;margin:18px auto 12px;display:flex;align-items:center;justify-content:center;background:#3ddc9722;border:1px solid #3ddc9755;color:var(--ok);font-size:20px;font-weight:700;}
h2{font-size:16px;font-weight:700;margin-bottom:8px;}
p{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:20px;}
.btn{width:100%;height:36px;border:none;border-radius:18px;background:var(--primary);box-shadow:var(--card-shadow);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background-color .15s ease;}
.btn:hover{background:var(--primary-hover);}
.btn:active{background:#7f2fe0;}
.btn:focus,.btn:focus-visible{outline:none;}
@keyframes up{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="panel">
  <img class="logo" src="../assets/logo.png" alt="" draggable="false">
  <div class="app">Fortnite <b>Unity</b> Converter</div>
  <div class="icon">&#10003;</div>
  <h2>Already open</h2>
  <p>The converter is already running, so we brought that window to the front. Only one copy can run at a time, which keeps your files and conversions safe.</p>
  <button class="btn" id="ok" autofocus>Got it</button>
</div>
<script>
document.getElementById('ok').onclick = () => window.close()
document.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') window.close() })
setTimeout(() => window.close(), 15000)
</script>
</body>
</html>
