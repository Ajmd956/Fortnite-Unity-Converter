<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Properties Viewer</title>
<style>
head,style,script,title,meta,link{display:none !important;}
@font-face{font-family:'SF Pro Text';font-weight:400;src:url('../assets/fonts/SF-Pro-Text-Regular.otf');}
@font-face{font-family:'SF Pro Text';font-weight:500;src:url('../assets/fonts/SF-Pro-Text-Medium.otf');}
@font-face{font-family:'SF Pro Text';font-weight:600;src:url('../assets/fonts/SF-Pro-Text-Semibold.otf');}
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0D0C12;--content:#09080D;--btn:#1D1B24;--btn-hover:#252332;--sel:#252332;--sel-hover:#2E2B3C;--bright:#322F40;--border:#1F1D2A;--text:#E2DFF0;--muted:#A8A4C0;--accent:#953bf8;--shadow:inset 0 3px 2px -2px #ffffff10,inset 0 10px 25px #ffffff05,inset 0 0 0 1.5px #ffffff0a,0 4px 8px #00000020,0 8px 12px #00000010;--mono:'Cascadia Code','Consolas','Menlo','Monospace',monospace;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'SF Pro Text','Segoe UI',system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;overflow:hidden;user-select:none;box-shadow:inset 0 0 0 1px #3D3C42;}
button{font-family:inherit;outline:none;border:none;color:inherit;background:none;}
#tb{flex:0 0 35px;height:35px;position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;-webkit-app-region:drag;}
#tb .logo{justify-self:end;width:20px;height:20px;margin-right:6px;}
#tb .ttl{font-weight:600;font-size:14px;}
.winctl{position:absolute;top:0;right:1px;display:flex;-webkit-app-region:no-drag;}
.winctl button{width:35px;height:35px;display:flex;align-items:center;justify-content:center;color:#b9b5c9;cursor:pointer;border-radius:4px;}
.winctl button:hover{background:#ffffff0a;color:#fff;}
.winctl .wc-close:hover{background:#FF0022;color:#fff;}
#tabs{flex:0 0 auto;display:flex;align-items:center;min-height:48px;padding:0 16px 0 14px;overflow-x:auto;overflow-y:hidden;}
#tabs::-webkit-scrollbar{height:0;}
.tab{flex:0 0 auto;margin-left:8px;height:32px;min-width:48px;max-width:320px;display:flex;align-items:center;gap:12px;padding:0 6px 0 9px;border-radius:16px;background:var(--btn);box-shadow:var(--shadow);cursor:pointer;font-size:14px;transition:background-color .12s;}
.tab:hover{background:var(--btn-hover);}
.tab:active{background:#232130;}
.tab.sel{background:var(--sel);}
.tab.sel:hover{background:var(--sel-hover);}
.tab .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tab .x{flex:0 0 22px;width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;}
.tab .x:hover{background:var(--bright);color:var(--text);}
#content{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--content);border-top:2px solid var(--border);position:relative;}
#ed{flex:1;min-height:0;display:flex;font-family:var(--mono);font-size:12px;line-height:16px;}
#gut{flex:0 0 auto;overflow:hidden;position:relative;user-select:none;cursor:default;}
#gutRows{position:absolute;left:0;top:0;right:0;}
#sc{flex:1;min-width:0;overflow:auto;position:relative;}
#sc::-webkit-scrollbar{width:14px;height:14px;}
#sc::-webkit-scrollbar-track{background:transparent;}
#sc::-webkit-scrollbar-thumb{background:#ffffff1c;border-radius:7px;border:3px solid transparent;background-clip:padding-box;}
#sc::-webkit-scrollbar-thumb:hover{background:#ffffff32;background-clip:padding-box;border:3px solid transparent;}
#sc::-webkit-scrollbar-corner{background:transparent;}
#sp{position:relative;}
#rows{position:absolute;left:0;top:0;min-width:100%;user-select:text;white-space:pre;cursor:text;}
.r{height:16px;position:relative;padding-left:2px;color:var(--text);}
.r::selection,.r *::selection{background:#953bf855;}
.g{position:absolute;top:0;height:16px;pointer-events:none;background:repeating-linear-gradient(90deg,#212121 0,#212121 1px,transparent 1px,transparent 14.4px);}
.k{color:#66c3cc;} .s{color:#c9a26d;} .n{color:#ed94c0;} .b{color:#6c95eb;} .z{color:#ff5647;} .p{color:#bdbdbd;}
.lk{color:#DDA0DD;cursor:pointer;}
.ph{color:#bdbdbd;background:#ffffff14;border-radius:2px;cursor:pointer;padding:0 1px;}
.ph:hover{background:#ffffff26;}
.gr{height:16px;display:flex;color:#808080;}
.num{text-align:right;padding-right:6px;flex:0 0 auto;}
.fc{position:relative;flex:0 0 15px;width:15px;height:16px;}
.fc i{position:absolute;background:#808081;pointer-events:none;}
.fc .t{left:7px;top:0;width:1px;height:8px;}
.fc .bt{left:7px;top:8px;width:1px;height:8px;}
.fc .tk{left:7px;top:8px;width:7px;height:1px;}
.fb{position:absolute;left:2px;top:3px;width:11px;height:11px;border:1px solid #808081;background:#212121;border-radius:1px;cursor:pointer;}
.fb::before{content:"";position:absolute;left:2px;top:4px;width:5px;height:1px;background:#D0D0D1;}
.fb.pl::after{content:"";position:absolute;left:4px;top:2px;width:1px;height:5px;background:#D0D0D1;}
.fb:hover{border-color:#D0D0D1;}
#msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:var(--content);}
#msg h3{font-size:17px;color:#f5b942;font-weight:600;}
#msg p{font-size:13px;color:var(--muted);max-width:520px;line-height:1.5;user-select:text;overflow-wrap:anywhere;}
.ring{width:42px;height:42px;border-radius:50%;border:4px solid #ffffff12;border-top-color:var(--accent);animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="tb"><img class="logo" src="../assets/logo.png"><div class="ttl">Properties Viewer</div><div></div>
  <div class="winctl">
    <button id="wMin"><svg width="15" height="15" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    <button id="wMax"><svg id="wMaxIc" width="18" height="18" viewBox="0 0 12 12" fill="none"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.2" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button id="wClose" class="wc-close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
  </div>
</div>
<div id="tabs"></div>
<div id="content">
  <div id="ed"><div id="gut"><div id="gutRows"></div></div><div id="sc"><div id="sp"><div id="rows"></div></div></div></div>
  <div id="msg"></div>
</div>
<script>
const $ = id => document.getElementById(id)
const XI = '<svg width="10" height="10" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'
const LH = 16
const tabs = []
let sel = null
let SET = {}
let CW = 7.2
let numW = 33
let rowsFirst = -1
let rowsLast = -1

function applyTheme(s) {
  const t = (s && s.theme) || {}
  const r = document.documentElement.style
  const map = { accent: '--accent', btn: '--btn', btnHover: '--btn-hover', bg: '--bg', content: '--content', border: '--border', text: '--text', muted: '--muted', sel: '--sel', selHover: '--sel-hover', btnBright: '--bright' }
  Object.keys(map).forEach(k => { if (typeof t[k] === 'string' && /^#[0-9a-fA-F]{6,8}$/.test(t[k])) r.setProperty(map[k], t[k]) })
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])) }
function measure() {
  const s = document.createElement('span')
  s.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font-family:var(--mono);font-size:12px;'
  s.textContent = 'M'.repeat(200)
  document.body.appendChild(s)
  const w = s.getBoundingClientRect().width / 200
  s.remove()
  if (w > 3) CW = w
}

const TOK = /("(?:[^"\\]|\\.)*")(\s*:)?|\b(true|false)\b|\b(null)\b|(\b0[xX][0-9a-fA-F]+|(?:\b\d+(?:\.\d+)?|\.\d+)(?:[eE][+-]?\d+)?)|([{}\[\],:])/g
function hl(text) {
  if (!text) return ''
  let out = '', last = 0, m
  TOK.lastIndex = 0
  while ((m = TOK.exec(text))) {
    if (m.index > last) out += esc(text.slice(last, m.index))
    if (m[1] !== undefined) {
      if (m[2] !== undefined) out += '<span class="k">' + esc(m[1]) + '</span><span class="p">' + esc(m[2]) + '</span>'
      else out += '<span class="s">' + esc(m[1]) + '</span>'
    } else if (m[3] !== undefined) out += '<span class="b">' + m[3] + '</span>'
    else if (m[4] !== undefined) out += '<span class="z">null</span>'
    else if (m[5] !== undefined) out += '<span class="n">' + m[5] + '</span>'
    else out += '<span class="p">' + m[6] + '</span>'
    last = TOK.lastIndex
  }
  if (last < text.length) out += esc(text.slice(last))
  return out
}
const LINK = /^(\s*)("(?:ObjectPath|AssetPathName|AssetName|ParameterName|CollisionProfileName|TableId)": "(?!\/?Script\/)([^"]*\/[^"]*)")(,?)$/i
function lineHtml(t, L) {
  const text = t.lines[L]
  const reg = t.startAt.get(L)
  if (reg && reg.collapsed) {
    const end = t.lines[reg.e]
    return hl(text.slice(0, reg.cS)) + '<span class="ph" data-l="' + L + '">' + (reg.ch === '{' ? '{...}' : '[...]') + '</span>' + hl(end.slice(reg.cE + 1))
  }
  const lm = LINK.exec(text)
  if (lm) return esc(lm[1]) + '<span class="lk" data-p="' + esc(lm[3]) + '">' + esc(lm[2]) + '</span>' + (lm[4] ? '<span class="p">,</span>' : '')
  return hl(text)
}
function indentLevel(text) {
  let n = 0
  while (n < text.length) { const c = text.charCodeAt(n); if (c === 32) n++; else if (c === 9) n += 2; else break }
  return Math.floor(n / 2)
}

function buildDoc(t, text) {
  const lines = text.split('\n')
  for (let i = 0; i < lines.length; i++) if (lines[i].endsWith('\r')) lines[i] = lines[i].slice(0, -1)
  t.lines = lines
  const n = lines.length
  const regs = []
  const topLines = []
  const stack = []
  let maxLen = 0
  for (let L = 0; L < n; L++) {
    const ln = lines[L]
    if (ln.length > maxLen) maxLen = ln.length
  }
  let inStr = false, esc2 = false
  for (let L = 0; L < n; L++) {
    const ln = lines[L]
    for (let c = 0; c < ln.length; c++) {
      const ch = ln.charCodeAt(c)
      if (esc2) { esc2 = false; continue }
      if (ch === 92) { esc2 = true; continue }
      if (ch === 34) { inStr = !inStr; continue }
      if (inStr) continue
      if (ch === 123 || ch === 91) {
        if (stack.length === 1 && ch === 123) topLines.push(L)
        stack.push({ s: L, cS: c, ch: ch === 123 ? '{' : '[' })
      } else if (ch === 125 || ch === 93) {
        if (stack.length) {
          const top = stack[stack.length - 1]
          const want = ch === 125 ? '{' : '['
          if (top.ch === want) {
            stack.pop()
            if (L > top.s) regs.push({ s: top.s, e: L, cS: top.cS, cE: c, ch: top.ch, collapsed: false })
          }
        }
      }
    }
    inStr = false
    esc2 = false
  }
  regs.sort((a, b) => a.s - b.s || b.e - a.e)
  t.regs = regs
  t.startAt = new Map()
  t.endAt = new Map()
  regs.forEach(r => {
    if (!t.startAt.has(r.s)) t.startAt.set(r.s, r)
    if (!t.endAt.has(r.e)) t.endAt.set(r.e, r)
  })
  t.topLines = topLines
  t.maxLen = maxLen
  t.digits = String(n).length
  rebuildVis(t)
}

function rebuildVis(t) {
  const n = t.lines.length
  const vis = new Int32Array(n)
  let vn = 0, i = 0
  while (i < n) {
    vis[vn++] = i
    const r = t.startAt.get(i)
    if (r && r.collapsed) i = r.e + 1
    else i++
  }
  t.vis = vis
  t.vn = vn
  const diff = new Int32Array(n + 2)
  t.regs.forEach(r => { if (!r.collapsed && r.e - r.s > 1) { diff[r.s + 1]++; diff[r.e]-- } })
  const cov = new Int32Array(n + 1)
  let acc = 0
  for (let k = 0; k < n; k++) { acc += diff[k]; cov[k] = acc }
  t.cov = cov
}

function visIndexOf(t, L) {
  let lo = 0, hi = t.vn - 1
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1
    if (t.vis[mid] <= L) lo = mid; else hi = mid - 1
  }
  return lo
}

function setLayout(t) {
  numW = Math.round(Math.max(t.digits, 3) * CW + 11)
  $('gut').style.width = (numW + 15) + 'px'
  $('sp').style.height = (t.vn * LH) + 'px'
  $('sp').style.width = Math.ceil(2 + t.maxLen * CW + 48) + 'px'
}

function gutterRow(t, L) {
  let h = '<div class="gr"><span class="num" style="width:' + numW + 'px">' + (L + 1) + '</span><span class="fc">'
  const st = t.startAt.get(L)
  const en = t.endAt.get(L)
  const cov = t.cov[L] > 0
  if (st) {
    if (cov) h += '<i class="t"></i>'
    if (cov || !st.collapsed) h += '<i class="bt"></i>'
    h += '<b class="fb' + (st.collapsed ? ' pl' : '') + '" data-l="' + L + '"></b>'
  } else if (en && !en.collapsed) {
    h += '<i class="t"></i><i class="tk"></i>'
    if (cov) h += '<i class="bt"></i>'
  } else if (cov) h += '<i class="t"></i><i class="bt"></i>'
  return h + '</span></div>'
}

function render() {
  const t = sel
  if (!t || !t.lines) return
  const sc = $('sc')
  const st = sc.scrollTop, vh = sc.clientHeight
  const first = Math.max(0, Math.floor(st / LH) - 6)
  const last = Math.min(t.vn - 1, Math.ceil((st + vh) / LH) + 6)
  let rows = '', gut = ''
  for (let i = first; i <= last; i++) {
    const L = t.vis[i]
    const lvl = indentLevel(t.lines[L])
    const g = lvl >= 2 ? '<i class="g" style="left:' + (2 + 3 * CW - 5).toFixed(2) + 'px;width:' + ((lvl - 1) * 2 * CW).toFixed(2) + 'px"></i>' : ''
    rows += '<div class="r">' + g + lineHtml(t, L) + '</div>'
    gut += gutterRow(t, L)
  }
  $('rows').innerHTML = rows
  $('rows').style.transform = 'translateY(' + (first * LH) + 'px)'
  $('gutRows').innerHTML = gut
  $('gutRows').style.transform = 'translateY(' + (first * LH - st) + 'px)'
  rowsFirst = first
  rowsLast = last
}

function toggleFold(L) {
  const t = sel
  const r = t && t.startAt.get(L)
  if (!r) return
  const sc = $('sc')
  const topIdx = Math.floor(sc.scrollTop / LH)
  const topLine = t.vis[Math.min(topIdx, t.vn - 1)]
  const keepLine = r.collapsed ? topLine : (topLine > r.s && topLine <= r.e ? r.s : topLine)
  r.collapsed = !r.collapsed
  rebuildVis(t)
  setLayout(t)
  sc.scrollTop = visIndexOf(t, keepLine) * LH
  render()
}

function showMsg(html) {
  const m = $('msg')
  m.innerHTML = html
  m.style.display = 'flex'
}
function hideMsg() { $('msg').style.display = 'none' }
function renderTabs() {
  const box = $('tabs')
  box.innerHTML = ''
  tabs.forEach(t => {
    const d = document.createElement('div')
    d.className = 'tab' + (t === sel ? ' sel' : '')
    d.title = t.path || t.name
    const n = document.createElement('span')
    n.className = 'nm'
    n.textContent = t.name
    const x = document.createElement('div')
    x.className = 'x'
    x.innerHTML = XI
    x.onclick = e => { e.stopPropagation(); closeTab(t) }
    d.appendChild(n); d.appendChild(x)
    d.onclick = () => select(t)
    d.onauxclick = e => { if (e.button === 1) closeTab(t) }
    box.appendChild(d)
  })
}
function closeTab(t) {
  const i = tabs.indexOf(t)
  if (i < 0) return
  tabs.splice(i, 1)
  if (!tabs.length) { pv.win.close(); return }
  if (sel === t) { sel = null; select(tabs[Math.min(i, tabs.length - 1)]) } else renderTabs()
}

function saveScroll() {
  const t = sel
  if (!t || !t.lines) return
  const idx = Math.min(Math.floor($('sc').scrollTop / LH), t.vn - 1)
  t.topLine = t.vis[Math.max(0, idx)]
  t.left = $('sc').scrollLeft
}
function scrollToLine(t, L) {
  const sc = $('sc')
  sc.scrollTop = visIndexOf(t, Math.max(0, Math.min(L, t.lines.length - 1))) * LH
  render()
}
async function select(t) {
  saveScroll()
  sel = t
  renderTabs()
  if (t.lines) {
    hideMsg()
    setLayout(t)
    const sc = $('sc')
    sc.scrollLeft = t.left || 0
    sc.scrollTop = visIndexOf(t, t.topLine || 0) * LH
    render()
    return
  }
  $('rows').innerHTML = ''
  $('gutRows').innerHTML = ''
  if (t.error) { showMsg('<h3>' + esc(t.error.title) + '</h3><p>' + esc(t.error.text) + '</p>'); return }
  showMsg('<div class="ring"></div><div style="color:var(--muted);font-size:13px">Loading the properties from the game files...</div>')
  if (!t.loading) load(t)
}
async function load(t) {
  t.loading = true
  try {
    const job = await pv.multiJob(t.id)
    if (!job.ok || job.kind !== 'json') {
      t.error = { title: 'Could not load the properties', text: job.note || job.error || 'unknown error' }
    } else {
      const bytes = await pv.read(job.file)
      if (!bytes) throw new Error('could not read ' + job.file)
      let text = new TextDecoder('utf-8').decode(bytes)
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1)
      buildDoc(t, text)
      t.topLine = 0
      if (t.targetIndex >= 0 && t.topLines[t.targetIndex] != null) t.topLine = t.topLines[t.targetIndex]
    }
  } catch (e) {
    t.error = { title: 'The viewer hit an error', text: String(e && e.message || e) }
  }
  t.loading = false
  if (sel === t) select(t)
}
function addTab(p) {
  const have = tabs.find(t => t.name === p.name)
  if (have) {
    if (p.index != null && p.index >= 0) {
      if (have.lines && have.topLines[p.index] != null) { select(have).then(() => scrollToLine(have, have.topLines[p.index])) }
      else { have.targetIndex = p.index; select(have) }
    } else select(have)
    return
  }
  const t = { id: p.id, name: p.name, path: p.path, lines: null, error: null, loading: false, topLine: 0, left: 0, targetIndex: p.index != null ? p.index : -1 }
  tabs.push(t)
  select(t)
}

$('sc').addEventListener('scroll', () => { if (sel && sel.lines) render() })
$('gut').addEventListener('wheel', e => { $('sc').scrollTop += e.deltaY; e.preventDefault() }, { passive: false })
$('gut').addEventListener('mousedown', e => {
  const b = e.target.closest('.fb')
  if (b) toggleFold(parseInt(b.dataset.l, 10))
})
$('rows').addEventListener('click', e => {
  const lk = e.target.closest('.lk')
  if (lk) { pv.openProps(lk.dataset.p); return }
  const ph = e.target.closest('.ph')
  if (ph) toggleFold(parseInt(ph.dataset.l, 10))
})
new ResizeObserver(() => render()).observe($('sc'))

$('wMin').onclick = () => pv.win.minimize()
$('wMax').onclick = () => pv.win.toggleMaximize()
$('wClose').onclick = () => pv.win.close()
const MAX_IC = '<rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.2" stroke="currentColor" stroke-width="1.3"/>'
const RESTORE_IC = '<path d="M4 2.2h5a1.4 1.4 0 0 1 1.4 1.4v5M2.2 4.3h5.1a.9.9 0 0 1 .9.9v5.1a.9.9 0 0 1-.9.9H3.1a.9.9 0 0 1-.9-.9V5.2a.9.9 0 0 1 .9-.9z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>'

async function main() {
  try { SET = (await pv.settings()) || {}; applyTheme(SET) } catch (e) {}
  measure()
  pv.onAdd(addTab)
  const list = await pv.multiInit()
  list.forEach(addTab)
}
main()
</script>
</body>
</html>
