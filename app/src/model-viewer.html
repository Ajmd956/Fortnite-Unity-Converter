<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Model Viewer</title>
<style>
head,style,script,title,meta,link{display:none !important;}
@font-face{font-family:'SF Pro Text';font-weight:400;src:url('../assets/fonts/SF-Pro-Text-Regular.otf');}
@font-face{font-family:'SF Pro Text';font-weight:500;src:url('../assets/fonts/SF-Pro-Text-Medium.otf');}
@font-face{font-family:'SF Pro Text';font-weight:600;src:url('../assets/fonts/SF-Pro-Text-Semibold.otf');}
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0D0C12;--content:#09080D;--btn:#1D1B24;--btn-hover:#252332;--sel:#252332;--sel-hover:#2E2B3C;--bright:#322F40;--border:#1F1D2A;--text:#E2DFF0;--muted:#A8A4C0;--accent:#953bf8;--shadow:inset 0 3px 2px -2px #ffffff10,inset 0 10px 25px #ffffff05,inset 0 0 0 1.5px #ffffff0a,0 4px 8px #00000020,0 8px 12px #00000010;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'SF Pro Text','Segoe UI',system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;overflow:hidden;user-select:none;box-shadow:inset 0 0 0 1px #3D3C42;}
button{font-family:inherit;outline:none;border:none;color:inherit;background:none;}
#tb{flex:0 0 35px;height:35px;position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;-webkit-app-region:drag;}
#tb .logo{justify-self:end;width:20px;height:20px;margin-right:6px;}
#tb .ttl{font-weight:600;font-size:14px;}
.winctl{position:absolute;top:0;right:1px;display:flex;-webkit-app-region:no-drag;}
.winctl button{width:35px;height:35px;display:flex;align-items:center;justify-content:center;color:#b9b5c9;cursor:pointer;border-radius:4px;}
.winctl button:hover{background:#ffffff0a;color:#fff;}
.winctl .wc-close:hover{background:#FF0022;color:#fff;}
#content{flex:1;min-height:0;background:var(--content);border-top:2px solid var(--border);padding:8px;position:relative;}
#grid{height:100%;display:grid;grid-template-columns:3fr 8px 1fr;min-height:0;}
#view{grid-column:1;position:relative;overflow:hidden;min-width:0;}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;}
#side{grid-column:3;display:none;flex-direction:column;min-height:0;min-width:0;}
#side.on{display:flex;}
#cards{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;}
#cards::-webkit-scrollbar{width:0;}
.card{border-radius:16px;background:linear-gradient(180deg,#181620,#16141E);box-shadow:var(--shadow);padding:12px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr 1fr;align-items:center;}
.card .ic{grid-row:1/3;grid-column:1;width:48px;height:48px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.card .ic img{width:48px;height:48px;object-fit:contain;}
.card .nm{grid-row:1;grid-column:2;margin-left:12px;align-self:end;font-weight:600;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .cl{grid-row:2;grid-column:2;margin-left:12px;align-self:start;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#btns{flex:0 0 auto;margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.btn{height:32px;border-radius:16px;background:var(--btn);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--text);cursor:pointer;transition:background-color .12s;}
.btn:hover{background:var(--btn-hover);}
.btn:active{background:#232130;}
.btn:disabled{opacity:.5;cursor:default;background:var(--btn);}
.btn svg{width:18px;height:18px;}
#msg{position:absolute;inset:8px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:var(--content);z-index:2;}
#msg h3{font-size:17px;color:#f5b942;font-weight:600;}
#msg p{font-size:13px;color:var(--muted);max-width:520px;line-height:1.5;user-select:text;overflow-wrap:anywhere;}
.ring{width:42px;height:42px;border-radius:50%;border:4px solid #ffffff12;border-top-color:var(--accent);animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

<div id="tb"><img class="logo" src="../assets/logo.png"><div class="ttl">Model Viewer</div><div></div>
  <div class="winctl">
    <button id="wMin"><svg width="15" height="15" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    <button id="wMax"><svg id="wMaxIc" width="18" height="18" viewBox="0 0 12 12" fill="none"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.2" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button id="wClose" class="wc-close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
  </div>
</div>

  <div id="grid">

    </div>
  </div>
  <div id="msg"></div>
</div>
<script>
const $ = id => document.getElementById(id)

let SET = {}

function applyTheme(s) {

  const r = document.documentElement.style
  const map = { accent: '--accent', btn: '--btn', btnHover: '--btn-hover', bg: '--bg', content: '--content', border: '--border', text: '--text', muted: '--muted', sel: '--sel', selHover: '--sel-hover', btnBright: '--bright' }

async function loadGltf(file) {

function accessor(g, idx, asIndex) {

    for (let i = 0; i < v.length; i++) out[i] = norm ? Math.max(v[i] / norm, -1) : v[i]

    const dv = new DataView(buf.buffer)
    const get = { 5120: 'getInt8', 5121: 'getUint8', 5122: 'getInt16', 5123: 'getUint16', 5125: 'getUint32', 5126: 'getFloat32' }[a.componentType]
    for (let i = 0; i < n; i++) for (let c = 0; c < comps; c++) { const v = dv[get](start + i * stride + c * bp, true); out[i * comps + c] = norm ? Math.max(v / norm, -1) : v }
  }

}

function buildTangents(pos, nrm, uv, idx, nv) {
  const acc = new Float32Array(nv * 3)
  for (let t = 0; t + 2 < idx.length; t += 3) {
    const a = idx[t], b = idx[t + 1], c = idx[t + 2]
    const e1x = pos[b * 3] - pos[a * 3], e1y = pos[b * 3 + 1] - pos[a * 3 + 1], e1z = pos[b * 3 + 2] - pos[a * 3 + 2]
    const e2x = pos[c * 3] - pos[a * 3], e2y = pos[c * 3 + 1] - pos[a * 3 + 1], e2z = pos[c * 3 + 2] - pos[a * 3 + 2]
    const du1 = uv[b * 2] - uv[a * 2], dv1 = uv[b * 2 + 1] - uv[a * 2 + 1]
    const du2 = uv[c * 2] - uv[a * 2], dv2 = uv[c * 2 + 1] - uv[a * 2 + 1]
    const d = du1 * dv2 - du2 * dv1
    const r = Math.abs(d) < 1e-12 ? 0 : 1 / d
    const tx = (e1x * dv2 - e2x * dv1) * r, ty = (e1y * dv2 - e2y * dv1) * r, tz = (e1z * dv2 - e2z * dv1) * r
    for (const k of [a, b, c]) { acc[k * 3] += tx; acc[k * 3 + 1] += ty; acc[k * 3 + 2] += tz }
  }
  for (let i = 0; i < nv; i++) {
    const nx = nrm[i * 3], ny = nrm[i * 3 + 1], nz = nrm[i * 3 + 2]
    let x = acc[i * 3], y = acc[i * 3 + 1], z = acc[i * 3 + 2]
    const d = x * nx + y * ny + z * nz
    x -= d * nx; y -= d * ny; z -= d * nz

      l = Math.hypot(x, y, z) || 1
    }
    acc[i * 3] = x / l; acc[i * 3 + 1] = y / l; acc[i * 3 + 2] = z / l
  }
  return acc
}

function buildScene(g) {

        pos[i * 3] = X; pos[i * 3 + 1] = Y; pos[i * 3 + 2] = Z

      if (prim.attributes.NORMAL !== undefined) {
        const n0 = accessor(g, prim.attributes.NORMAL)
        nrm = new Float32Array(n0.length)
        for (let i = 0; i < nv; i++) {
          const x = n0[i * 3], y = n0[i * 3 + 1], z = n0[i * 3 + 2]
          const X = m[0] * x + m[4] * y + m[8] * z, Y = m[1] * x + m[5] * y + m[9] * z, Z = m[2] * x + m[6] * y + m[10] * z
          const l = Math.hypot(X, Y, Z) || 1
          nrm[i * 3] = X / l; nrm[i * 3 + 1] = Y / l; nrm[i * 3 + 2] = Z / l
        }

          const ux = pos[b * 3] - pos[a * 3], uy = pos[b * 3 + 1] - pos[a * 3 + 1], uz = pos[b * 3 + 2] - pos[a * 3 + 2]

        }
        for (let i = 0; i < nv; i++) { const l = Math.hypot(nrm[i * 3], nrm[i * 3 + 1], nrm[i * 3 + 2]) || 1; nrm[i * 3] /= l; nrm[i * 3 + 1] /= l; nrm[i * 3 + 2] /= l }
      }
      const uv = prim.attributes.TEXCOORD_0 !== undefined ? accessor(g, prim.attributes.TEXCOORD_0) : new Float32Array(nv * 2)
      let tan
      if (prim.attributes.TANGENT !== undefined) {
        const t0 = accessor(g, prim.attributes.TANGENT)
        tan = new Float32Array(nv * 3)
        for (let i = 0; i < nv; i++) {
          const x = t0[i * 4], y = t0[i * 4 + 1], z = t0[i * 4 + 2]
          const X = m[0] * x + m[4] * y + m[8] * z, Y = m[1] * x + m[5] * y + m[9] * z, Z = m[2] * x + m[6] * y + m[10] * z
          const l = Math.hypot(X, Y, Z) || 1

      const lay = new Float32Array(nv)
      if (prim.attributes.TEXCOORD_1 !== undefined) {
        const u1 = accessor(g, prim.attributes.TEXCOORD_1)

      const det = m[0] * (m[5] * m[10] - m[9] * m[6]) - m[4] * (m[1] * m[10] - m[9] * m[2]) + m[8] * (m[1] * m[6] - m[5] * m[2])
      const mat = prim.material !== undefined ? (J.materials || [])[prim.material] : null
      const pbr = (mat && mat.pbrMetallicRoughness) || {}
      let tex = -1
      if (pbr.baseColorTexture && (J.textures || [])[pbr.baseColorTexture.index]) tex = J.textures[pbr.baseColorTexture.index].source

    }
  }

    if (seen.has(i) || !nodes[i]) return
    seen.add(i)
    const n = nodes[i]
    const m = M4.mul(parent, local(n))
    if (n.mesh !== undefined && (J.meshes || [])[n.mesh]) addMesh(J.meshes[n.mesh], m)
    ;(n.children || []).forEach(c => walk(c, m))
  }
  const scene = (J.scenes || [])[J.scene || 0]
  let roots = scene && scene.nodes
  if (!roots) { const kids = new Set(); nodes.forEach(n => (n.children || []).forEach(c => kids.add(c))); roots = nodes.map((_, i) => i).filter(i => !kids.has(i)) }
  roots.forEach(r => walk(r, M4.id()))
  if (!batches.length && (J.meshes || []).length) J.meshes.forEach(mesh => addMesh(mesh, M4.id()))
  return { batches, bb }
}


const cv = $('gl')
const gl = cv.getContext('webgl2', { antialias: true, alpha: false })
let items = []
let pending = 0
let scene = { ready: false, center: [0, 0, 0] }
const cam = { pos: [5, 5, 5], yaw: 0, pitch: 0, speed: 5, fov: 70, near: 0.1, far: 10000 }
const keys = new Set()

function showMsg(html) { const m = $('msg'); m.innerHTML = html; m.style.display = 'flex' }
function hideMsg() { $('msg').style.display = 'none' }

let prog = null, gprog = null, U = {}, GU = {}, gridVao = null, defaults = []
function sh(t, s) { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x }

  gl.bindAttribLocation(p, 0, 'aPos'); gl.bindAttribLocation(p, 1, 'aNrm'); gl.bindAttribLocation(p, 2, 'aUV'); gl.bindAttribLocation(p, 3, 'aTan'); gl.bindAttribLocation(p, 4, 'aLayer')

}

  const FS = `#version 300 es
precision highp float;
in vec3 fP;in vec3 fN;in vec3 fT;in vec2 fUV;in float fL;
uniform vec3 uCam;uniform float uMirror;uniform bool uUseLayers;uniform int uMaxLayer;
uniform sampler2D diffuse0;uniform sampler2D diffuse1;uniform sampler2D diffuse2;uniform sampler2D diffuse3;
uniform sampler2D normal0;uniform sampler2D normal1;uniform sampler2D normal2;uniform sampler2D normal3;
uniform sampler2D specular0;uniform sampler2D specular1;uniform sampler2D specular2;uniform sampler2D specular3;
out vec4 FragColor;

async function loadItem(m) {
  try {
    const job = await pv.multiJob(m.id)
    if (m.removed) return
    if (!job.ok || job.kind !== 'model') throw { title: 'Could not preview this', text: job.note || job.error || 'unknown error' }
    m.cls = job.cls || m.cls || 'StaticMesh'
    m.g = await loadGltf(job.file)
    try { m.matInfo = await pv.materials(m.id) } catch (e) { m.matInfo = [] }
    const sc = buildScene(m.g)
    const tris = sc.batches.reduce((s, b) => s + b.idx.length / 3, 0)
    if (!tris) throw { title: 'Nothing to draw', text: 'This export has no triangle geometry.' }
    m.batches = sc.batches
    m.bb = sc.bb
    const rad = Math.hypot(m.bb.max[0] - m.bb.min[0], m.bb.max[1] - m.bb.min[1], m.bb.max[2] - m.bb.min[2]) / 2

    if (m.scaled) {
      m.batches.forEach(b => { for (let i = 0; i < b.pos.length; i++) b.pos[i] *= 0.01 })
      for (let i = 0; i < 3; i++) { m.bb.min[i] *= 0.01; m.bb.max[i] *= 0.01 }

    const e = bad ? bad.error : { title: 'Nothing to show', text: 'No model was loaded.' }

  }
  let off = 0
  const all = { min: [Infinity, Infinity, Infinity], max: [-Infinity, -Infinity, -Infinity] }
  for (const m of ok) {
    const w = m.bb0.max[0] - m.bb0.min[0]
    m.batches.forEach(b => {
      if (b.vao) gl.deleteVertexArray(b.vao)
      b.pos = b.base
      if (off) { b.pos = new Float32Array(b.base); for (let i = 0; i < b.pos.length; i += 3) b.pos[i] += off }

  const m = { id: p.id, name: p.name, path: p.path, cls: p.cls || '', state: 'loading', batches: [], error: null }
  items.push(m)
  pending++

  loadItem(m).then(() => { if (m.removed) return; pending--; if (!pending) finalize() })
