<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Texture Viewer</title>
<style>
head,style,script,title,meta,link{display:none !important;}
@font-face{font-family:'SF Pro Text';font-weight:400;src:url('../assets/fonts/SF-Pro-Text-Regular.otf');}
@font-face{font-family:'SF Pro Text';font-weight:500;src:url('../assets/fonts/SF-Pro-Text-Medium.otf');}
@font-face{font-family:'SF Pro Text';font-weight:600;src:url('../assets/fonts/SF-Pro-Text-Semibold.otf');}
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0D0C12;--content:#09080D;--btn:#1D1B24;--btn-hover:#252332;--sel:#252332;--sel-hover:#2E2B3C;--bright:#322F40;--border:#1F1D2A;--text:#E2DFF0;--muted:#A8A4C0;--accent:#953bf8;--shadow:inset 0 3px 2px -2px #ffffff10,inset 0 10px 25px #ffffff05,inset 0 0 0 1.5px #ffffff0a,0 4px 8px #00000020,0 8px 12px #00000010;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'SF Pro Text','Segoe UI',system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;overflow:hidden;user-select:none;box-shadow:inset 0 0 0 1px #3D3C42;}
button{font-family:inherit;outline:none;border:none;color:inherit;background:none;}
#tb{flex:0 0 35px;height:35px;position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;-webkit-app-region:drag;}
#tb .logo{justify-self:end;width:20px;height:20px;margin-right:6px;}
#tb .ttl{font-weight:600;font-size:14px;}
.winctl{position:absolute;top:0;right:1px;display:flex;-webkit-app-region:no-drag;}
.winctl button{width:35px;height:35px;display:flex;align-items:center;justify-content:center;color:#b9b5c9;cursor:pointer;border-radius:4px;}
.winctl button:hover{background:#ffffff0a;color:#fff;}
.winctl .wc-close:hover{background:#FF0022;color:#fff;}
#tabs{flex:0 0 auto;display:flex;align-items:center;min-height:48px;padding:0 16px 0 9px;overflow-x:auto;overflow-y:hidden;}
#tabs::-webkit-scrollbar{height:0;}
.tab{flex:0 0 auto;margin-left:8px;height:32px;min-width:48px;max-width:320px;display:flex;align-items:center;gap:12px;padding:0 6px 0 9px;border-radius:16px;background:var(--btn);box-shadow:var(--shadow);cursor:pointer;font-size:14px;transition:background-color .12s;}
.tab:hover{background:var(--btn-hover);}
.tab:active{background:#232130;}
.tab.sel{background:var(--sel);}
.tab.sel:hover{background:var(--sel-hover);}
.tab .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tab .x{flex:0 0 22px;width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;}
.tab .x:hover{background:var(--bright);color:var(--text);}
#content{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--content);border-top:2px solid var(--border);}
#ctl{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px;}
.grp{display:flex;align-items:center;gap:8px;}
.lab{font-weight:600;font-size:14px;}
.nb{display:flex;align-items:center;width:104px;height:32px;border-radius:16px;background:var(--btn);box-shadow:var(--shadow);padding:0 4px 0 12px;}
.nb input{flex:1;min-width:0;width:100%;background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:14px;user-select:text;}
.nb .sp{flex:0 0 26px;width:26px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;}
.nb .sp:hover{background:var(--btn-hover);}
.nb .sp.off{color:#686490;cursor:default;pointer-events:none;}
.chk{display:flex;gap:0;align-items:center;}
.cb{width:20px;height:20px;border-radius:50%;margin:0 8px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow);}
.cb svg{width:14px;height:14px;opacity:1;}
.cb.off svg{opacity:0;}
.cb.r{background:#E81123;} .cb.g{background:#10893E;} .cb.b{background:#0063B1;} .cb.a{background:#6B6B6B;}
.cb.r:hover{background:#ee3341;} .cb.g:hover{background:#2a9a55;} .cb.b:hover{background:#1a77c0;} .cb.a:hover{background:#7d7d7d;}
#stage{flex:1;min-height:0;margin:8px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
#cv{border-radius:16px;display:block;}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;}
#msg h3{font-size:17px;color:#f5b942;font-weight:600;}
#msg p{font-size:13px;color:var(--muted);max-width:520px;line-height:1.5;user-select:text;overflow-wrap:anywhere;}
.ring{width:42px;height:42px;border-radius:50%;border:4px solid #ffffff12;border-top-color:var(--accent);animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="tb"><img class="logo" src="../assets/logo.png"><div class="ttl">Texture Viewer</div><div></div>
  <div class="winctl">
    <button id="wMin"><svg width="15" height="15" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    <button id="wMax"><svg id="wMaxIc" width="18" height="18" viewBox="0 0 12 12" fill="none"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.2" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button id="wClose" class="wc-close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
  </div>
</div>
<div id="tabs"></div>
<div id="content">
  <div id="ctl">
    <div class="grp"><span class="lab">Mipmap</span><div class="nb" id="nbMip"><input id="inMip" type="text" spellcheck="false"><div class="sp" id="mipUp"></div><div class="sp" id="mipDn"></div></div></div>
    <div class="grp"><span class="lab">Layer</span><div class="nb" id="nbLay"><input id="inLay" type="text" spellcheck="false"><div class="sp" id="layUp"></div><div class="sp" id="layDn"></div></div></div>
    <div class="grp"><span class="lab">Channels</span><div class="chk"><div class="cb r" data-c="r"></div><div class="cb g" data-c="g"></div><div class="cb b" data-c="b"></div><div class="cb a" data-c="a"></div></div></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="msg" style="display:none"></div></div>
</div>
<script>
const $ = id => document.getElementById(id)
const CHECK = '<svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
const UP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41,15.41L12,10.83L16.59,15.41L18,14L12,8L6,14L7.41,15.41Z"/></svg>'
const DN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z"/></svg>'
const XI = '<svg width="10" height="10" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'
document.querySelectorAll('.cb').forEach(e => { e.innerHTML = CHECK })
;['mipUp', 'layUp'].forEach(i => { $(i).innerHTML = UP })
;['mipDn', 'layDn'].forEach(i => { $(i).innerHTML = DN })

const tabs = []
let sel = null
let SET = {}
let loadToken = 0

function applyTheme(s) {
  const t = (s && s.theme) || {}
  const r = document.documentElement.style
  const map = { accent: '--accent', btn: '--btn', btnHover: '--btn-hover', bg: '--bg', content: '--content', border: '--border', text: '--text', muted: '--muted', sel: '--sel', selHover: '--sel-hover', btnBright: '--bright' }
  Object.keys(map).forEach(k => { if (typeof t[k] === 'string' && /^#[0-9a-fA-F]{6,8}$/.test(t[k])) r.setProperty(map[k], t[k]) })
}

function showMsg(html) {
  const m = $('msg')
  m.innerHTML = html
  m.style.display = 'flex'
  $('cv').style.display = 'none'
}
function showCanvas() { $('msg').style.display = 'none'; $('cv').style.display = 'block' }
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])) }

function nextMip(src) {
  const w = Math.max(1, src.w >> 1), h = Math.max(1, src.h >> 1)
  const out = new Uint8ClampedArray(w * h * 4)
  const s = src.d
  for (let y = 0; y < h; y++) {
    const y0 = Math.min(src.h - 1, y * 2), y1 = Math.min(src.h - 1, y * 2 + 1)
    for (let x = 0; x < w; x++) {
      const x0 = Math.min(src.w - 1, x * 2), x1 = Math.min(src.w - 1, x * 2 + 1)
      const a = (y0 * src.w + x0) * 4, b = (y0 * src.w + x1) * 4, c = (y1 * src.w + x0) * 4, d = (y1 * src.w + x1) * 4
      const o = (y * w + x) * 4
      for (let k = 0; k < 4; k++) out[o + k] = (s[a + k] + s[b + k] + s[c + k] + s[d + k] + 2) >> 2
    }
  }
  return { w, h, d: out }
}
function mipAt(t, i) {
  while (t.mips.length <= i) t.mips.push(nextMip(t.mips[t.mips.length - 1]))
  return t.mips[i]
}

function colorize(m, ch) {
  const out = new Uint8ClampedArray(m.d.length)
  const s = m.d
  const n = (ch.r ? 1 : 0) + (ch.g ? 1 : 0) + (ch.b ? 1 : 0)
  for (let i = 0; i < s.length; i += 4) {
    let r = s[i], g = s[i + 1], b = s[i + 2], a = s[i + 3]
    if (n === 1) {
      const v = ch.r ? r : ch.g ? g : b
      r = g = b = v
      if (!ch.a) a = 255
    } else if (n === 0 && ch.a) {
      r = g = b = a
      a = 255
    } else {
      if (!ch.b) b = 0
      if (!ch.g) g = 0
      if (!ch.r) r = 0
      if (!ch.a) a = 255
    }
    out[i] = r; out[i + 1] = g; out[i + 2] = b; out[i + 3] = a
  }
  return out
}

function fitCanvas() {
  const cv = $('cv'), st = $('stage')
  if (!sel || !sel.mips || cv.style.display === 'none') return
  const m = mipAt(sel, sel.mip)
  const sw = st.clientWidth, sh = st.clientHeight
  const k = Math.min(sw / m.w, sh / m.h)
  cv.style.width = Math.max(1, Math.floor(m.w * k)) + 'px'
  cv.style.height = Math.max(1, Math.floor(m.h * k)) + 'px'
}

function draw() {
  if (!sel || !sel.mips) return
  const m = mipAt(sel, sel.mip)
  const cv = $('cv')
  if (cv.width !== m.w || cv.height !== m.h) { cv.width = m.w; cv.height = m.h }
  const ctx = cv.getContext('2d')
  const img = new ImageData(colorize(m, sel.ch), m.w, m.h)
  ctx.putImageData(img, 0, 0)
  fitCanvas()
}

function syncControls() {
  const t = sel
  const ready = !!(t && t.mips)
  const mip = t ? t.mip : 0, maxMip = t ? t.maxMip : 0
  $('inMip').value = mip
  $('inLay').value = t ? t.layer : 0
  $('mipUp').classList.toggle('off', !ready || mip >= maxMip)
  $('mipDn').classList.toggle('off', !ready || mip <= 0)
  $('layUp').classList.add('off')
  $('layDn').classList.add('off')
  document.querySelectorAll('.cb').forEach(e => e.classList.toggle('off', !(t && t.ch[e.dataset.c])))
}

function renderTabs() {
  const box = $('tabs')
  box.innerHTML = ''
  tabs.forEach(t => {
    const d = document.createElement('div')
    d.className = 'tab' + (t === sel ? ' sel' : '')
    d.title = t.path || t.name
    const n = document.createElement('span')
    n.className = 'nm'
    n.textContent = t.name
    const x = document.createElement('div')
    x.className = 'x'
    x.innerHTML = XI
    x.onclick = e => { e.stopPropagation(); closeTab(t) }
    d.appendChild(n); d.appendChild(x)
    d.onclick = () => select(t)
    d.onauxclick = e => { if (e.button === 1) closeTab(t) }
    box.appendChild(d)
  })
}

function closeTab(t) {
  const i = tabs.indexOf(t)
  if (i < 0) return
  tabs.splice(i, 1)
  if (!tabs.length) { pv.win.close(); return }
  if (sel === t) sel = tabs[Math.min(i, tabs.length - 1)]
  renderTabs()
  select(sel)
}

async function select(t) {
  sel = t
  renderTabs()
  syncControls()
  if (t.mips) { showCanvas(); draw(); return }
  if (t.error) { showMsg('<h3>' + esc(t.error.title) + '</h3><p>' + esc(t.error.text) + '</p>'); return }
  showMsg('<div class="ring"></div><div style="color:var(--muted);font-size:13px">Loading the texture from the game files...</div>')
  if (!t.loading) load(t)
}

async function load(t) {
  t.loading = true
  try {
    const job = await pv.multiJob(t.id)
    if (!job.ok || job.kind !== 'texture') {
      t.error = { title: 'Could not preview this', text: job.note || job.error || 'unknown error' }
    } else {
      const bytes = await pv.read(job.file)
      if (!bytes) throw new Error('could not read ' + job.file)
      const bmp = await createImageBitmap(new Blob([bytes], { type: 'image/png' }))
      const c = document.createElement('canvas')
      c.width = bmp.width; c.height = bmp.height
      const cx = c.getContext('2d', { willReadFrequently: true })
      cx.drawImage(bmp, 0, 0)
      const id = cx.getImageData(0, 0, bmp.width, bmp.height)
      t.mips = [{ w: bmp.width, h: bmp.height, d: id.data }]
      t.maxMip = Math.floor(Math.log2(Math.max(bmp.width, bmp.height)))
      t.mip = 0
    }
  } catch (e) {
    t.error = { title: 'The viewer hit an error', text: String(e && e.message || e) }
  }
  t.loading = false
  if (sel === t) select(t)
}

function addTab(p) {
  const name = p.name
  const have = tabs.find(t => t.name === name)
  if (have) { select(have); return }
  const t = { id: p.id, name, path: p.path, mips: null, mip: 0, maxMip: 0, layer: 0, ch: { r: true, g: true, b: true, a: true }, error: null, loading: false }
  tabs.push(t)
  select(t)
}

function setMip(v) {
  if (!sel || !sel.mips) { syncControls(); return }
  v = Math.max(0, Math.min(sel.maxMip, Math.round(Number(v))))
  if (!isFinite(v)) v = sel.mip
  sel.mip = v
  syncControls()
  draw()
}
$('mipUp').onclick = () => setMip((sel ? sel.mip : 0) + 1)
$('mipDn').onclick = () => setMip((sel ? sel.mip : 0) - 1)
$('inMip').onchange = () => setMip($('inMip').value)
$('inMip').onkeydown = e => {
  if (e.key === 'Enter') { setMip($('inMip').value); e.target.blur() }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setMip((sel ? sel.mip : 0) + 1) }
  else if (e.key === 'ArrowDown') { e.preventDefault(); setMip((sel ? sel.mip : 0) - 1) }
}
$('nbMip').addEventListener('wheel', e => { e.preventDefault(); setMip((sel ? sel.mip : 0) + (e.deltaY < 0 ? 1 : -1)) }, { passive: false })
$('inLay').onchange = () => syncControls()
$('inLay').onkeydown = e => { if (e.key === 'Enter') { syncControls(); e.target.blur() } }
document.querySelectorAll('.cb').forEach(e => {
  e.onclick = () => { if (!sel) return; sel.ch[e.dataset.c] = !sel.ch[e.dataset.c]; syncControls(); draw() }
})
window.addEventListener('resize', fitCanvas)
new ResizeObserver(fitCanvas).observe($('stage'))

$('wMin').onclick = () => pv.win.minimize()
$('wMax').onclick = () => pv.win.toggleMaximize()
$('wClose').onclick = () => pv.win.close()
const MAX_IC = '<rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.2" stroke="currentColor" stroke-width="1.3"/>'
const RESTORE_IC = '<path d="M4 2.2h5a1.4 1.4 0 0 1 1.4 1.4v5M2.2 4.3h5.1a.9.9 0 0 1 .9.9v5.1a.9.9 0 0 1-.9.9H3.1a.9.9 0 0 1-.9-.9V5.2a.9.9 0 0 1 .9-.9z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>'

async function main() {
  try { SET = (await pv.settings()) || {}; applyTheme(SET) } catch (e) {}
  syncControls()
  pv.onAdd(addTab)
  const list = await pv.multiInit()
  list.forEach(addTab)
}
main()
</script>
</body>
</html>
