<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Sound Cue Viewer</title>
<style>
head,style,script,title,meta,link{display:none !important;}
@font-face{font-family:'SF Pro Text';font-weight:400;src:url('../assets/fonts/SF-Pro-Text-Regular.otf');}
@font-face{font-family:'SF Pro Text';font-weight:500;src:url('../assets/fonts/SF-Pro-Text-Medium.otf');}
@font-face{font-family:'SF Pro Text';font-weight:600;src:url('../assets/fonts/SF-Pro-Text-Semibold.otf');}
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0D0C12;--content:#09080D;--btn:#1D1B24;--btn-hover:#252332;--sel:#252332;--sel-hover:#2E2B3C;--bright:#322F40;--border:#1F1D2A;--text:#E2DFF0;--muted:#A8A4C0;--accent:#953bf8;--shadow:inset 0 3px 2px -2px #ffffff10,inset 0 10px 25px #ffffff05,inset 0 0 0 1.5px #ffffff0a,0 4px 8px #00000020,0 8px 12px #00000010;--mono:'Cascadia Code','Consolas','Menlo','Monospace',monospace;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'SF Pro Text','Segoe UI',system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;overflow:hidden;user-select:none;box-shadow:inset 0 0 0 1px #3D3C42;}
button{font-family:inherit;outline:none;border:none;color:inherit;background:none;}
input{font-family:inherit;outline:none;border:none;color:inherit;background:none;}
#tb{flex:0 0 35px;height:35px;position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;-webkit-app-region:drag;}
#tb .logo{justify-self:end;width:20px;height:20px;margin-right:6px;}
#tb .ttl{font-weight:600;font-size:14px;}
.winctl{position:absolute;top:0;right:1px;display:flex;-webkit-app-region:no-drag;}
.winctl button{width:35px;height:35px;display:flex;align-items:center;justify-content:center;color:#b9b5c9;cursor:pointer;border-radius:4px;}
.winctl button:hover{background:#ffffff0a;color:#fff;}
.winctl .wc-close:hover{background:#FF0022;color:#fff;}
#tabs{flex:0 0 auto;display:flex;align-items:center;min-height:48px;padding:0 16px 0 9px;overflow-x:auto;overflow-y:hidden;}
#tabs::-webkit-scrollbar{height:0;}
.tab{flex:0 0 auto;margin-left:8px;height:32px;min-width:48px;max-width:320px;display:flex;align-items:center;gap:12px;padding:0 6px 0 9px;border-radius:16px;background:var(--btn);box-shadow:var(--shadow);cursor:pointer;}
.tab:hover{background:var(--btn-hover);}
.tab:active{background:#232130;}
.tab.sel{background:var(--sel);}
.tab.sel:hover{background:var(--sel-hover);}
.tab .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tab .x{flex:0 0 22px;width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;}
.tab .x:hover{background:var(--bright);color:var(--text);}
#content{flex:1;min-height:0;display:flex;gap:8px;padding:8px;background:var(--content);border-top:2px solid var(--border);position:relative;}

/* the node canvas */
#stage{flex:4 1 0;min-width:0;position:relative;overflow:hidden;border-radius:16px;background-color:#212024;background-image:linear-gradient(90deg,#161616 1.5%,transparent 1.5%),linear-gradient(180deg,#161616 1.5%,transparent 1.5%),linear-gradient(90deg,#343434 3%,transparent 3%),linear-gradient(180deg,#343434 3%,transparent 3%);background-size:248px 248px,248px 248px,62px 62px,62px 62px;box-shadow:var(--shadow);cursor:grab;touch-action:none;}
#stage.drag{cursor:grabbing;}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform;}
#world.anim{transition:transform .22s ease;}
#cmts,#nodes{position:absolute;left:0;top:0;width:0;height:0;}
#wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;}
#wires path{fill:none;stroke:#d3d3d3;stroke-opacity:.5;stroke-width:3;stroke-linecap:butt;}
.cm{position:absolute;border-radius:4px;background:rgba(var(--cc),.31);border:1px solid rgba(var(--cc),.45);}
.cm .ch{height:29px;line-height:29px;padding:0 8px;font-size:14px;font-weight:600;color:#fff;text-shadow:0 1px 2px #000a;background:rgba(var(--cc),.76);border-radius:3px 3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.node{position:absolute;border-radius:4px;background:linear-gradient(to top right,#1111119d,#21212182);cursor:default;}
.node::after{content:'';position:absolute;inset:0;border:2px solid #12121299;border-radius:4px;pointer-events:none;}
.node.sel::after{border-color:#d77601;}
.nh{position:absolute;left:2px;right:2px;top:2px;height:25px;line-height:25px;padding:0 8px;font-size:14px;font-weight:600;color:#f1f1f6;border-radius:3px 3px 0 0;display:flex;align-items:center;gap:6px;overflow:hidden;text-shadow:1px 1px 0 #00000080;}
.nh span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nh em{flex:0 0 auto;font-style:normal;font-size:9px;font-weight:500;color:#ffffffb0;background:#00000040;border-radius:8px;padding:0 6px;line-height:14px;}
.nrs{position:absolute;left:0;right:0;top:27px;}
.nr{position:absolute;left:0;right:0;height:18px;font-size:12px;font-weight:400;line-height:18px;color:#f1f1f6;text-shadow:1px 1px 0 #00000080;}
.nin{position:absolute;left:26.5px;white-space:nowrap;}
.nout{position:absolute;right:26.5px;white-space:nowrap;text-align:right;}
.pin{position:absolute;top:2px;width:14px;height:14px;box-sizing:border-box;border-radius:50%;background:#d3d3d3;}
.pin.in{left:5px;}
.pin.out{right:5px;}
.cn{position:absolute;overflow:hidden;}
.tex{width:128px;height:128px;margin:0;border-radius:3px;overflow:hidden;position:relative;background:repeating-conic-gradient(#2a2a2e 0 25%,#1d1d21 0 50%) 0 0/16px 16px;display:flex;align-items:center;justify-content:center;}
.tex img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;}
.tex.ok img{display:block;}
.tex b{font-size:9px;font-weight:500;color:#9a9aa8;padding:0 6px;text-align:center;overflow-wrap:anywhere;}
.tex.ok b{display:none;}
.sw{height:22px;margin-top:0;border-radius:3px;box-shadow:inset 0 0 0 1px #ffffff26;}
.val{height:22px;margin-top:0;line-height:22px;line-height:20px;text-align:center;font-size:11px;color:#e8e8ee;background:#0000004d;border-radius:3px;box-shadow:inset 0 0 0 1px #ffffff12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msk{display:flex;gap:4px;}
.msk u{flex:1;height:20px;line-height:20px;text-align:center;text-decoration:none;font-size:10px;font-weight:600;color:#7d7d89;background:#0000004d;border-radius:3px;box-shadow:inset 0 0 0 1px #ffffff12;}
.msk u.on{color:#fff;background:#4b4b66;}
.cn .spk{display:block;margin:0 auto;}
.cn pre{font-family:var(--mono);font-size:9px;line-height:11px;color:#c9a26d;white-space:pre;overflow:hidden;height:80px;margin-top:2px;}
.nf{position:absolute;left:8px;right:8px;height:16px;line-height:16px;font-size:10px;font-style:italic;color:#9a9aa8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lod1 .nr span,.lod1 .nf{visibility:hidden;}
.lod2 .nh span,.lod2 .nh em,.lod2 .cn,.lod2 .cm .ch{visibility:hidden;}
.hud{position:absolute;z-index:3;display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:16px;background:#1D1B24e6;box-shadow:var(--shadow);font-size:12px;color:var(--muted);cursor:default;}
.hud button{height:24px;padding:0 10px;border-radius:12px;background:var(--btn-hover);color:var(--text);cursor:pointer;font-size:12px;}
.hud button:hover{background:var(--bright);}
#hudZ{left:12px;bottom:12px;}
#crumb{left:12px;top:12px;display:none;}
#crumb b{font-weight:600;color:var(--text);}

/* the node list */
#side{flex:1 1 0;min-width:0;display:flex;flex-direction:column;min-height:0;gap:8px;overflow:hidden;}
#q{flex:0 0 32px;height:32px;border-radius:16px;padding:0 16px;background:var(--btn);box-shadow:var(--shadow);font-size:14px;color:var(--text);user-select:text;}
#q::placeholder{color:var(--muted);}
#list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;border-radius:10px;}
#list::-webkit-scrollbar,#props::-webkit-scrollbar{width:10px;}
#list::-webkit-scrollbar-thumb,#props::-webkit-scrollbar-thumb{background:#ffffff1c;border-radius:5px;border:2px solid transparent;background-clip:padding-box;}
#list::-webkit-scrollbar-thumb:hover,#props::-webkit-scrollbar-thumb:hover{background:#ffffff32;background-clip:padding-box;border:2px solid transparent;}
.li{padding:8px 16px;margin:2px;border-radius:8px;cursor:pointer;}
.li:hover{background:var(--btn);}
.li.on{background:var(--sel);box-shadow:var(--shadow);}
.li .p{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li .s{font-size:12px;color:#A8A4C0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li.more{cursor:default;color:var(--muted);font-size:12px;}
.li.more:hover{background:none;}
#card{position:absolute;top:8px;right:8px;z-index:4;padding:16px;border-radius:16px;background:linear-gradient(#181620,#16141E);box-shadow:var(--shadow);display:none;user-select:text;cursor:default;max-width:min(440px,70%);max-height:calc(100% - 16px);overflow-y:auto;}
#card::-webkit-scrollbar{width:8px;}
#card::-webkit-scrollbar-thumb{background:#ffffff1c;border-radius:4px;}
#card h4{font-size:14px;font-weight:600;text-align:center;margin-bottom:8px;overflow-wrap:anywhere;}
#card .cr{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;margin:4px 0;font-size:12px;min-height:28px;}
#card .cr>i{font-style:normal;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;}
#card .cr>div,#card .cr>span{justify-self:end;text-align:right;min-width:0;overflow-wrap:anywhere;color:var(--text);}
#card .cb{width:38px;height:28px;border-radius:14px;background:var(--btn);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;font-size:11px;font-weight:600;}
#card .cb:hover{background:var(--btn-hover);}
#card .cb:active{background:#232130;}
#card .nb{min-width:72px;height:30px;line-height:30px;padding:0 10px;border-radius:6px;background:#0000004d;box-shadow:inset 0 0 0 1px #ffffff14;text-align:right;}
#card pre{grid-column:1/-1;font-family:var(--mono);font-size:11px;line-height:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto;background:#0000004d;border-radius:6px;padding:6px 8px;user-select:text;}
#card .sq{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;box-shadow:inset 0 0 0 1px #ffffff40;}
#msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:var(--content);z-index:5;}
#msg h3{font-size:17px;color:#f5b942;font-weight:600;}
#msg p{font-size:13px;color:var(--muted);max-width:520px;line-height:1.5;user-select:text;overflow-wrap:anywhere;}
.ring{width:42px;height:42px;border-radius:50%;border:4px solid #ffffff12;border-top-color:var(--accent);animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="tb"><img class="logo" src="../assets/logo.png"><div class="ttl">Sound Cue Viewer</div><div></div>
  <div class="winctl">
    <button id="wMin"><svg width="15" height="15" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    <button id="wMax"><svg id="wMaxIc" width="18" height="18" viewBox="0 0 12 12" fill="none"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.2" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button id="wClose" class="wc-close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
  </div>
</div>
<div id="tabs"></div>
<div id="content">
  <div id="stage">
    <div id="world">
      <div id="cmts"></div>
      <svg id="wires" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="nodes"></div>
    </div>
    <div class="hud" id="crumb"></div>
    <div id="card"></div>
  </div>
  <div id="side">
    <input id="q" type="text" placeholder="Search..." spellcheck="false" autocomplete="off">
    <div id="list"></div>
  </div>
  <div id="msg"></div>
</div>
<script src="material-graph.js"></script>
<script src="soundcue-graph.js"></script>
<script>
const $ = id => document.getElementById(id)
const MG = window.MaterialGraph
const XI = '<svg width="10" height="10" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'
const MIN_K = 0.1
const MAX_K = 3
const GRID = 24
const tabs = []
let sel = null
let SET = {}
let V = { x: 0, y: 0, k: 1 }
let cur = null
let texTimer = 0
let texBusy = 0
const texCache = new Map()

function applyTheme(s) {
  const t = (s && s.theme) || {}
  const r = document.documentElement.style
  const map = { accent: '--accent', btn: '--btn', btnHover: '--btn-hover', bg: '--bg', content: '--content', border: '--border', text: '--text', muted: '--muted', sel: '--sel', selHover: '--sel-hover', btnBright: '--bright' }
  Object.keys(map).forEach(k => { if (typeof t[k] === 'string' && /^#[0-9a-fA-F]{6,8}$/.test(t[k])) r.setProperty(map[k], t[k]) })
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }
const HEX6 = /^#[0-9a-fA-F]{6}$/
const fmtNum = v => String(Math.round(v * 1e5) / 1e5)
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))

/* ---------- text measuring for node sizes ---------- */
let mctx = null
function measure(s) {
  if (!mctx) {
    mctx = document.createElement('canvas').getContext('2d')
  }
  mctx.font = '600 14px "SF Pro Text","Segoe UI",system-ui,sans-serif'
  return mctx.measureText(String(s)).width
}
function measurePort(s) {
  if (!mctx) mctx = document.createElement('canvas').getContext('2d')
  mctx.font = '400 12px "SF Pro Text","Segoe UI",system-ui,sans-serif'
  return mctx.measureText(String(s)).width
}

/* ---------- messages ---------- */
function showMsg(html) { const m = $('msg'); m.innerHTML = html; m.style.display = 'flex' }
function hideMsg() { $('msg').style.display = 'none' }

/* ---------- tabs ---------- */
function renderTabs() {
  const box = $('tabs')
  box.innerHTML = ''
  tabs.forEach(t => {
    const d = document.createElement('div')
    d.className = 'tab' + (t === sel ? ' sel' : '')
    d.title = t.path || t.name
    const n = document.createElement('span')
    n.className = 'nm'
    n.textContent = t.name
    const x = document.createElement('div')
    x.className = 'x'
    x.innerHTML = XI
    x.onclick = e => { e.stopPropagation(); closeTab(t) }
    d.appendChild(n); d.appendChild(x)
    d.onclick = () => select(t)
    d.onauxclick = e => { if (e.button === 1) closeTab(t) }
    box.appendChild(d)
  })
}
function closeTab(t) {
  const i = tabs.indexOf(t)
  if (i < 0) return
  tabs.splice(i, 1)
  if (!tabs.length) { pv.win.close(); return }
  if (sel === t) { sel = null; cur = null; select(tabs[Math.min(i, tabs.length - 1)]) } else renderTabs()
}

/* ---------- view (pan and zoom) ---------- */
function applyView() {
  $('world').style.transform = 'translate(' + V.x + 'px,' + V.y + 'px) scale(' + V.k + ')'
  const st = $('stage')
  const G = 248 * V.k + 'px'
  const g = 62 * V.k + 'px'
  st.style.backgroundSize = G + ' ' + G + ',' + G + ' ' + G + ',' + g + ' ' + g + ',' + g + ' ' + g
  const pos = V.x + 'px ' + V.y + 'px'
  st.style.backgroundPosition = pos + ',' + pos + ',' + pos + ',' + pos
  st.classList.toggle('lod1', V.k < 0.22)
  st.classList.toggle('lod2', V.k < 0.11)
  if (cur) cur.lv.v = { x: V.x, y: V.y, k: V.k }
  scheduleTex()
}
function zoomAt(px, py, nk) {
  nk = clamp(nk, MIN_K, MAX_K)
  const wx = (px - V.x) / V.k
  const wy = (py - V.y) / V.k
  V.k = nk
  V.x = px - wx * nk
  V.y = py - wy * nk
  applyView()
}
function animate() {
  const w = $('world')
  w.classList.add('anim')
  clearTimeout(animate.t)
  animate.t = setTimeout(() => w.classList.remove('anim'), 260)
}
function centerAvg(k, anim) {
  if (!cur) return
  const st = $('stage')
  const W = st.clientWidth
  const H = st.clientHeight
  if (W < 50 || H < 50) { cur.needFit = true; return }
  const ns = cur.data.nodes.concat(cur.data.comments)
  if (!ns.length) { V = { x: W / 2, y: H / 2, k }; applyView(); return }
  let sx = 0, sy = 0
  ns.forEach(n => { sx += n.x; sy += n.y })
  if (anim) animate()
  V = { k, x: W / 2 - (sx / ns.length) * k, y: H / 2 - (sy / ns.length) * k }
  applyView()
}
function fit(anim) {
  if (!cur) return
  const st = $('stage')
  const W = st.clientWidth
  const H = st.clientHeight
  if (W < 50 || H < 50) { cur.needFit = true; return }
  const ns = cur.data.nodes.concat(cur.data.comments)
  if (!ns.length) { centerAvg(1, anim); return }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity
  ns.forEach(n => {
    x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y)
    x1 = Math.max(x1, n.x + (n.w || 0)); y1 = Math.max(y1, n.y + (n.h || 0))
  })
  const k = Math.max(MIN_K, Math.min(0.46, (W - 80) / Math.max(1, x1 - x0), (H - 80) / Math.max(1, y1 - y0)))
  if (anim) animate()
  V = { k, x: W / 2 - ((x0 + x1) / 2) * k, y: H / 2 - ((y0 + y1) / 2) * k }
  applyView()
}
function focusNode(n) {
  const st = $('stage')
  animate()
  V = { k: V.k, x: st.clientWidth / 2 - n.x * V.k, y: st.clientHeight / 2 - n.y * V.k }
  applyView()
}

/* ---------- drawing one level of the graph ---------- */
function contentHtml(n) {
  const c = n.content
  if (!c) return ''
  switch (c.kind) {
    case 'tex': return '<div class="tex" data-p="' + esc(c.path) + '"><img alt=""><b>' + esc(c.name || 'Texture') + '</b></div>'
    case 'color': {
      const hx = HEX6.test(c.hex) ? c.hex : '#000000'
      return '<div class="sw" style="background:' + hx + '" title="R ' + fmtNum(c.r) + '  G ' + fmtNum(c.g) + '  B ' + fmtNum(c.b) + '  A ' + fmtNum(c.a) + '"></div>'
    }
    case 'num': return '<div class="val">' + fmtNum(c.v) + '</div>'
    case 'bool': return '<div class="val">' + (c.v ? 'True' : 'False') + '</div>'
    case 'mask': return '<div class="msk"><u class="' + (c.r ? 'on' : '') + '">R</u><u class="' + (c.g ? 'on' : '') + '">G</u><u class="' + (c.b ? 'on' : '') + '">B</u><u class="' + (c.a ? 'on' : '') + '">A</u></div>'
    case 'speaker': return '<img class="spk" src="../assets/ui/SoundCue_SpeakerIcon.png" width="128" height="128" alt="">'
    case 'code': return '<pre>' + esc(String(c.text || '').slice(0, 700)) + '</pre>'
  }
  return ''
}
function nodeHtml(n, i) {
  const H = MG.H
  const col = HEX6.test(n.color) ? n.color : '#60815c'
  const rows = n.rows || 0
  let badge = ''
  if (n.composite) badge = '<em>' + (n.subCount || 0) + ' nodes</em>'
  else if (n.package) badge = '<em>Function</em>'
  let rh = ''
  for (let r = 0; r < rows; r++) {
    const a = n.inputs[r]
    const b = n.outputs[r]
    rh += '<div class="nr" style="top:' + (r * H.row) + 'px">'
    if (a) rh += '<i class="pin in"></i><span class="nin">' + esc(a.name) + '</span>'
    if (b) rh += '<i class="pin out"' + (HEX6.test(b.color) ? ' style="background:' + b.color + '"' : '') + '></i><span class="nout">' + esc(b.name) + '</span>'
    rh += '</div>'
  }
  const cTop = H.top + (n.content && n.content.kind === 'speaker' ? 0 : 8)
  const fTop = H.top + (n.body || 0) + H.pad
  const tip = n.composite ? 'Double-click to open this subgraph' : n.package ? 'Double-click to open this material function' : n.name
  return '<div class="node' + (n.isRoot ? ' root' : '') + '" data-i="' + i + '" title="' + esc(tip) + '" style="left:' + n.x + 'px;top:' + n.y + 'px;width:' + n.w + 'px;height:' + n.h + 'px">' +
    '<div class="nh" style="background:linear-gradient(90deg,' + col + ',' + col + '40)"><span>' + esc(n.label) + '</span>' + badge + '</div>' +
    '<div class="nrs" style="height:' + (rows * H.row) + 'px">' + rh + '</div>' +
    (n.contentH ? '<div class="cn" style="left:' + n.cx + 'px;width:' + n.cw + 'px;top:' + cTop + 'px;height:' + n.contentH + 'px">' + contentHtml(n) + '</div>' : '') +
    (n.footer ? '<div class="nf" style="top:' + fTop + 'px">' + esc(n.footer) + '</div>' : '') +
    '</div>'
}
const r1 = v => Math.round(v * 10) / 10
function wirePath(c) {
  const a = MG.pinPos(c.from, 'out', c.fi)
  const b = MG.pinPos(c.to, 'in', c.ti)
  const dx = Math.max(40, Math.abs(b.x - a.x) * 0.5)
  return 'M' + r1(a.x) + ' ' + r1(a.y) + 'C' + r1(a.x + dx) + ' ' + r1(a.y) + ' ' + r1(b.x - dx) + ' ' + r1(b.y) + ' ' + r1(b.x) + ' ' + r1(b.y)
}
function renderLevel() {
  const t = sel
  if (!t || !t.graph) return
  const lv = t.levels[t.levels.length - 1]
  const data = MG.view(t.graph, lv.owner)
  cur = { t, lv, data, list: data.nodes, els: new Map(), wireEls: [], nodeWires: new Map(), selKey: lv.sel || null, needFit: false }

  const cms = data.comments.slice().sort((a, b) => (b.w * b.h) - (a.w * a.h))
  $('cmts').innerHTML = cms.map(c => {
    const rgb = c.rgb || [183, 183, 183]
    return '<div class="cm" style="--cc:' + rgb.map(v => v | 0).join(',') + ';left:' + c.x + 'px;top:' + c.y + 'px;width:' + (c.w || 200) + 'px;height:' + (c.h || 100) + 'px"><div class="ch">' + esc(c.text) + '</div></div>'
  }).join('')

  $('nodes').innerHTML = data.nodes.map(nodeHtml).join('')
  $('nodes').querySelectorAll('.node').forEach(el => { cur.els.set(cur.list[+el.dataset.i].key, el) })

  $('wires').innerHTML = data.conns.map(c => '<path d="' + wirePath(c) + '"/>').join('')
  cur.wireEls = Array.from($('wires').children)
  data.conns.forEach((c, i) => {
    ;[c.from, c.to].forEach(n => {
      if (!cur.nodeWires.has(n)) cur.nodeWires.set(n, [])
      cur.nodeWires.get(n).push(i)
    })
  })

  renderCrumb()
  if (lv.v) { V = Object.assign({}, lv.v); applyView() } else requestAnimationFrame(() => centerAvg(1, false))
  if (cur.selKey) markSelected(cur.selKey)
  else showProps(null)
}
function renderCrumb() {
  const t = sel
  const box = $('crumb')
  if (!t || t.levels.length < 2) { box.style.display = 'none'; return }
  const names = t.levels.slice(1).map(l => { const n = t.graph.nodes.get(l.owner); return n ? n.label : 'Subgraph' })
  box.innerHTML = '<button id="cBack">Back</button><span>' + esc(t.name) + ' / <b>' + esc(names.join(' / ')) + '</b></span>'
  box.style.display = 'flex'
  $('cBack').onclick = back
}
function back() {
  const t = sel
  if (!t || t.levels.length < 2) return
  t.levels.pop()
  renderLevel()
}
function enter(n) {
  const t = sel
  if (!t || !n.composite) return
  t.levels.push({ owner: n.key })
  renderLevel()
}

/* ---------- selection ---------- */
function markSelected(key) {
  if (!cur) return
  cur.els.forEach(el => el.classList.remove('sel'))
  const n = cur.list.find(x => x.key === key)
  if (!n) { cur.selKey = null; showProps(null); return }
  cur.selKey = key
  cur.lv.sel = key
  const el = cur.els.get(key)
  if (el) el.classList.add('sel')
  showProps(n)
  document.querySelectorAll('#list .li.on').forEach(e => e.classList.remove('on'))
  const li = document.querySelector('#list .li[data-k="' + CSS.escape(key) + '"]')
  if (li) { li.classList.add('on'); li.scrollIntoView({ block: 'nearest' }) }
}
function selectNode(n) {
  if (!cur) return
  if (!n) { cur.els.forEach(el => el.classList.remove('sel')); cur.selKey = null; cur.lv.sel = null; showProps(null); document.querySelectorAll('#list .li.on').forEach(e => e.classList.remove('on')); return }
  markSelected(n.key)
}
function levelsFor(graph, n) {
  const chain = []
  let o = n.owner
  const seen = new Set()
  while (o && !seen.has(o)) {
    seen.add(o)
    chain.unshift(o)
    const on = graph.nodes.get(o)
    o = on && on.owner
  }
  return chain
}
function goTo(n) {
  const t = sel
  if (!t || !t.graph) return
  const want = levelsFor(t.graph, n)
  const have = t.levels.slice(1).map(l => l.owner)
  const same = want.length === have.length && want.every((k, i) => k === have[i])
  if (!same) {
    t.levels = [t.levels[0]].concat(want.map(k => ({ owner: k })))
    renderLevel()
  }
  markSelected(n.key)
  focusNode(n)
}

/* ---------- properties of the selected node ---------- */
function isColor(v) { return v && typeof v === 'object' && !Array.isArray(v) && 'R' in v && 'G' in v && 'B' in v }
function valHtml(v) {
  if (v === null || v === undefined) return 'None'
  if (typeof v === 'boolean') return v ? 'True' : 'False'
  if (typeof v === 'number') return fmtNum(v)
  if (typeof v === 'string') return esc(v)
  if (Array.isArray(v)) {
    const s = JSON.stringify(v)
    return v.length + ' items' + (s.length < 140 ? ': ' + esc(s) : '')
  }
  if (isColor(v)) {
    const c = ['R', 'G', 'B'].map(k => Math.round(clamp(+v[k] || 0, 0, 1) * 255))
    return '<i class="sq" style="background:rgb(' + c.join(',') + ')"></i>' + [v.R, v.G, v.B, v.A].map(x => fmtNum(+x || 0)).join(', ')
  }
  if (typeof v === 'object') {
    if (v.ObjectName) return esc(MG.shortName(v.ObjectName))
    if (v.Text !== undefined) return esc(v.Text)
    if (v.Name !== undefined && Object.keys(v).length <= 2) return esc(v.Name)
    const s = JSON.stringify(v)
    return esc(s.length > 160 ? s.slice(0, 160) + '...' : s)
  }
  return esc(v)
}
const FOLDER_IC = '<svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>'
function refPath(v) {
  if (!v || typeof v !== 'object' || Array.isArray(v)) return ''
  if (typeof v.ObjectPath === 'string' && v.ObjectPath) return v.ObjectPath
  if (typeof v.AssetPathName === 'string' && v.AssetPathName && v.AssetPathName !== 'None') return v.AssetPathName
  return ''
}
const JSON_IC = '<svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M5 3h2v2H5v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5h2v2H5c-1.1-.3-2-.9-2-2v-4a2 2 0 0 0-2-2H0v-2h1a2 2 0 0 0 2-2V5a2 2 0 0 1 2-2m14 0a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2h1v2h-1a2 2 0 0 0-2 2v4a2 2 0 0 1-2 2h-2v-2h2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5h-2V3h2z"/></svg>'
function cardRow(k, v, box, n) {
  const row = document.createElement('div')
  row.className = 'cr'
  const lab = document.createElement('i')
  lab.textContent = k
  lab.title = k
  row.appendChild(lab)
  const rp = refPath(v)
  if (rp) {
    const b = document.createElement('div')
    b.className = 'cb'
    b.title = 'Navigate To'
    b.innerHTML = FOLDER_IC
    b.onclick = () => pv.gotoFile(rp)
    row.appendChild(b)
  } else if (typeof v === 'number') {
    const d = document.createElement('div')
    d.className = 'nb'
    d.textContent = fmtNum(v)
    row.appendChild(d)
  } else if (v !== null && typeof v === 'object' && !isColor(v)) {
    const b = document.createElement('div')
    b.className = 'cb'
    b.innerHTML = JSON_IC
    let pre = null
    b.onclick = () => {
      if (pre) { pre.remove(); pre = null; return }
      pre = document.createElement('pre')
      let txt = ''
      try { txt = JSON.stringify(v, null, 2) } catch (e) { txt = String(v) }
      pre.textContent = txt
      row.after(pre)
    }
    row.appendChild(b)
  } else {
    const d = document.createElement('span')
    d.innerHTML = valHtml(v)
    row.appendChild(d)
  }
  box.appendChild(row)
}
function showProps(n) {
  const box = $('card')
  if (!n) { box.style.display = 'none'; box.innerHTML = ''; return }
  box.innerHTML = ''
  const h = document.createElement('h4')
  h.textContent = n.cardTitle || n.label
  box.appendChild(h)
  ;(n.props || []).forEach(([k, v]) => cardRow(k, v, box, n))
  box.style.display = 'block'
}
/* ---------- node list and search ---------- */
function buildList(t) {
  const items = t.graph.order.map(n => {
    const primary = n.isRoot ? 'Output' : MG.spaced(String(n.name).split('_')[0])
    const secondary = n.listLabel || n.label
    n.cardTitle = primary
    return { n, primary, secondary, sortKey: n.sortKey || n.name, hay: (primary + ' ' + secondary + ' ' + n.name).toLowerCase() }
  })
  const coll = new Intl.Collator('en', { numeric: true, sensitivity: 'base' })
  items.sort((a, b) => coll.compare(a.sortKey, b.sortKey))
  t.items = items
}
const LIST_CAP = 1500
function renderList() {
  const t = sel
  const box = $('list')
  if (!t || !t.items) { box.innerHTML = ''; return }
  const q = $('q').value.trim().toLowerCase()
  const words = q ? q.split(/\s+/) : []
  const hits = words.length ? t.items.filter(it => words.every(w => it.hay.indexOf(w) >= 0)) : t.items
  let h = ''
  const shown = hits.length > LIST_CAP ? hits.slice(0, LIST_CAP) : hits
  shown.forEach(it => {
    h += '<div class="li' + (cur && cur.selKey === it.n.key ? ' on' : '') + '" data-k="' + esc(it.n.key) + '"><div class="p">' + esc(it.primary) + '</div><div class="s">' + esc(it.secondary) + '</div></div>'
  })
  if (hits.length > shown.length) h += '<div class="li more">' + (hits.length - shown.length) + ' more. Type to narrow the list.</div>'
  if (!hits.length) h = '<div class="li more">Nothing matches.</div>'
  box.innerHTML = h
}
$('list').addEventListener('click', e => {
  const li = e.target.closest('.li[data-k]')
  if (!li || !sel || !sel.graph) return
  const n = sel.graph.nodes.get(li.dataset.k)
  if (n) goTo(n)
})
$('q').addEventListener('input', renderList)
$('q').addEventListener('keydown', e => { if (e.key === 'Escape') { $('q').value = ''; renderList(); $('q').blur() } })

/* ---------- texture pictures on texture nodes ---------- */
function scheduleTex() {
  clearTimeout(texTimer)
  texTimer = setTimeout(loadVisibleTextures, 120)
}
function paintTex(el, url) {
  const img = el.querySelector('img')
  if (!img || !url) return
  img.src = url
  el.classList.add('ok')
}
function loadVisibleTextures() {
  if (!cur || V.k < 0.3) return
  const st = $('stage')
  const W = st.clientWidth
  const H = st.clientHeight
  const here = cur
  here.list.forEach(n => {
    if (!n.content || n.content.kind !== 'tex') return
    const el = here.els.get(n.key)
    const box = el && el.querySelector('.tex')
    if (!box || box.dataset.s) return
    const x = n.x * V.k + V.x
    const y = n.y * V.k + V.y
    if (x + n.w * V.k < -200 || y + n.h * V.k < -200 || x > W + 200 || y > H + 200) return
    const p = box.dataset.p
    if (texCache.has(p)) {
      const hit = texCache.get(p)
      box.dataset.s = '1'
      if (typeof hit === 'string') paintTex(box, hit)
      else if (hit && hit.then) hit.then(u => { if (u) paintTex(box, u) })
      return
    }
    if (texBusy >= 3) return
    box.dataset.s = '1'
    texBusy++
    const pr = pv.thumb(p).then(u => u || null, () => null)
    texCache.set(p, pr)
    pr.then(u => {
      texBusy--
      texCache.set(p, u)
      if (u) paintTex(box, u)
      scheduleTex()
    })
  })
}

/* ---------- mouse and keyboard ---------- */
const stage = $('stage')
let drag = null
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.button !== 1) return
  if (e.target.closest('.hud') || e.target.closest('#card')) return
  const nd = e.button === 0 && cur && e.target.closest ? e.target.closest('.node') : null
  const node = nd ? cur.list[+nd.dataset.i] : null
  drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: V.x, oy: V.y, moved: false, target: e.target, node, nx: node ? node.x : 0, ny: node ? node.y : 0, el: nd }
  try { stage.setPointerCapture(e.pointerId) } catch (err) {}
  e.preventDefault()
})
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return
  const dx = e.clientX - drag.sx
  const dy = e.clientY - drag.sy
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; if (!drag.node) stage.classList.add('drag') }
  if (!drag.moved) return
  if (drag.node) {
    const n = drag.node
    n.x = drag.nx + dx / V.k
    n.y = drag.ny + dy / V.k
    drag.el.style.left = n.x + 'px'
    drag.el.style.top = n.y + 'px'
    ;(cur.nodeWires.get(n) || []).forEach(i => cur.wireEls[i].setAttribute('d', wirePath(cur.data.conns[i])))
  } else { V.x = drag.ox + dx; V.y = drag.oy + dy; applyView() }
})
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return
  const d = drag
  drag = null
  stage.classList.remove('drag')
  if (d.node && cur) { if (!d.moved || cur.selKey !== d.node.key) selectNode(d.node); return }
  if (!d.moved && cur && d.target.closest) {
    const nd = d.target.closest('.node')
    selectNode(nd ? cur.list[+nd.dataset.i] : null)
  }
}
stage.addEventListener('pointerup', endDrag)
stage.addEventListener('pointercancel', endDrag)
stage.addEventListener('wheel', e => {
  if (e.target.closest && e.target.closest('#card')) return
  e.preventDefault()
  const r = stage.getBoundingClientRect()
  zoomAt(e.clientX - r.left, e.clientY - r.top, V.k * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0012)))
}, { passive: false })
stage.addEventListener('dblclick', e => {
  if (!cur) return
  // the canvas holds the pointer while it is pressed, so ask which node is really under it
  const under = document.elementFromPoint(e.clientX, e.clientY)
  const nd = under && under.closest && under.closest('.node')
  if (!nd) return
  const n = cur.list[+nd.dataset.i]
  if (n.composite) enter(n)
  else if (n.package) pv.openMaterial(n.package)
})
function goHome() { centerAvg(V.k, true) }
document.addEventListener('keydown', e => {
  if (e.target === $('q')) return
  if (e.key === 'Home') goHome()
  else if (e.key === 'Escape' || e.key === 'Backspace') back()
})
new ResizeObserver(() => { if (cur && cur.needFit) { cur.needFit = false; centerAvg(1, false) } else scheduleTex() }).observe(stage)

/* ---------- loading a material ---------- */
async function select(t) {
  if (sel && sel !== t && cur) cur.lv.v = { x: V.x, y: V.y, k: V.k }
  sel = t
  renderTabs()
  if (t.graph) {
    hideMsg()
    $('q').value = t.query || ''
    renderLevel()
    renderList()
    return
  }
  cur = null
  $('nodes').innerHTML = ''
  $('cmts').innerHTML = ''
  $('wires').innerHTML = ''
  $('list').innerHTML = ''
  showProps(null)
  $('crumb').style.display = 'none'
  if (t.error) { showMsg('<h3>' + esc(t.error.title) + '</h3><p>' + esc(t.error.text) + '</p>'); return }
  showMsg('<div class="ring"></div><div style="color:var(--muted);font-size:13px">Loading the sound cue from the game files...</div>')
  if (!t.loading) load(t)
}
async function load(t) {
  t.loading = true
  try {
    const job = await pv.multiJob(t.id)
    if (!job.ok) {
      t.error = { title: 'Could not load the sound cue', text: job.error || 'unknown error' }
    } else if (job.kind !== 'soundcue') {
      t.error = { title: 'No node graph for this asset', text: String(job.note || 'The game files have no node graph for this asset.').replace(/^This asset could not be shown as a soundcue \((.*)\)\.?$/, '$1') }
    } else {
      const bytes = await pv.read(job.file)
      if (!bytes) throw new Error('could not read ' + job.file)
      let text = new TextDecoder('utf-8').decode(bytes)
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1)
      const list = JSON.parse(text)
      try { await document.fonts.load('500 11px "SF Pro Text"') } catch (e) {}
      const graph = SoundCueGraph.build(list, { name: t.name })
      if (!graph.order.length) {
        t.error = { title: 'This sound cue has no nodes', text: 'The game files do not hold a node graph for ' + t.name + '.' }
      } else {
        SoundCueGraph.layout(graph, measure, measurePort)
        t.graph = graph
        t.levels = [{ owner: null }]
        buildList(t)
        if (graph.warnings.length) console.warn(graph.warnings.join('\n'))
      }
    }
  } catch (e) {
    t.error = { title: 'The viewer hit an error', text: String(e && e.message || e) }
  }
  t.loading = false
  if (sel === t) select(t)
}
function addTab(p) {
  const have = tabs.find(t => t.name === p.name)
  if (have) { select(have); return }
  const t = { id: p.id, name: p.name, path: p.path, graph: null, levels: null, items: null, error: null, loading: false, query: '' }
  tabs.push(t)
  select(t)
}

/* ---------- window controls ---------- */
$('wMin').onclick = () => pv.win.minimize()
$('wMax').onclick = () => pv.win.toggleMaximize()
$('wClose').onclick = () => pv.win.close()
const MAX_IC = '<rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.2" stroke="currentColor" stroke-width="1.3"/>'
const RESTORE_IC = '<path d="M4 2.2h5a1.4 1.4 0 0 1 1.4 1.4v5M2.2 4.3h5.1a.9.9 0 0 1 .9.9v5.1a.9.9 0 0 1-.9.9H3.1a.9.9 0 0 1-.9-.9V5.2a.9.9 0 0 1 .9-.9z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>'
pv.win.onState(m => { $('wMaxIc').innerHTML = m ? RESTORE_IC : MAX_IC })

async function main() {
  try { SET = (await pv.settings()) || {}; applyTheme(SET) } catch (e) {}
  pv.onAdd(addTab)
  const list = await pv.multiInit()
  list.forEach(addTab)
}
main()
</script>
