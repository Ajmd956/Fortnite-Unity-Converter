<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Preview</title>
<style>
@font-face{font-family:'SF Pro Text';font-weight:400;src:url('../assets/fonts/SF-Pro-Text-Regular.otf');}
@font-face{font-family:'SF Pro Text';font-weight:500;src:url('../assets/fonts/SF-Pro-Text-Medium.otf');}
@font-face{font-family:'SF Pro Text';font-weight:600;src:url('../assets/fonts/SF-Pro-Text-Semibold.otf');}
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0D0C12;--content:#09080D;--card:#181620;--btn:#1D1B24;--btn-hover:#252332;--border:#1F1D2A;--border-hi:#2F2D3C;--text:#f2f0f7;--muted:#8a869b;--accent:#8a45fa;--warn:#f5b942;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'SF Pro Text','Segoe UI',system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;overflow:hidden;user-select:none;}
button{font-family:inherit;outline:none;}
#top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap;}
#title{display:flex;flex-direction:column;min-width:0;margin-right:8px;}
#name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;}
#sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;}
.grow{flex:1;}
.btn{height:30px;padding:0 12px;background:var(--btn);border:none;border-radius:15px;color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;box-shadow:inset 0 0 0 1.5px #ffffff0a;}
.btn:hover{background:var(--btn-hover);}
.btn.on{background:var(--accent);color:#fff;}
.btn:disabled{opacity:.45;cursor:default;}
.chip{width:30px;padding:0;justify-content:center;font-weight:600;}
.chip.r.on{background:#c0392b;} .chip.g.on{background:#27ae60;} .chip.b.on{background:#2980b9;} .chip.a.on{background:#7f8c8d;}
.sep{width:1px;height:20px;background:var(--border-hi);margin:0 2px;}
#stage{flex:1;min-height:0;margin:0 12px;border-radius:16px;background:var(--content);box-shadow:inset 0 0 0 1.5px #ffffff0a;position:relative;overflow:hidden;}
#bar{flex:0 0 auto;display:flex;gap:16px;align-items:center;height:30px;padding:0 20px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;}
#bar span{overflow:hidden;text-overflow:ellipsis;}
#loading,#fail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;}
#fail{display:none;}
#fail h3{font-size:17px;color:var(--warn);font-weight:600;}
#fail p{font-size:13px;color:var(--muted);max-width:480px;line-height:1.5;user-select:text;overflow-wrap:anywhere;}
.ring{width:42px;height:42px;border-radius:50%;border:4px solid #ffffff12;border-top-color:var(--accent);animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.checker{background-color:#2a2832;background-image:conic-gradient(#3a3844 25%,transparent 0 50%,#3a3844 0 75%,transparent 0);background-size:20px 20px;}
.dark{background:#0a090e;}
#imgWrap{position:absolute;inset:0;cursor:grab;}
#imgWrap.drag{cursor:grabbing;}
#imgCv{position:absolute;left:0;top:0;transform-origin:0 0;}
#jsonBox{position:absolute;inset:0;display:flex;flex-direction:column;}
#jTools{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:10px;}
#jSearch{flex:1;min-width:0;height:30px;background:var(--btn);border:none;border-radius:15px;padding:0 14px;color:var(--text);font-family:inherit;font-size:13px;outline:none;user-select:text;box-shadow:inset 0 0 0 1.5px #ffffff0a;}
#jCount{font-size:12px;color:var(--muted);min-width:70px;text-align:right;}
#jTree,#jRaw{flex:1;min-height:0;overflow:auto;padding:4px 10px 12px;font-family:'Cascadia Mono',Consolas,monospace;font-size:12px;line-height:20px;user-select:text;}
#jRaw{white-space:pre;display:none;}
.n>.row{display:flex;align-items:center;min-height:20px;border-radius:4px;white-space:nowrap;cursor:default;}
.n>.row:hover{background:#ffffff0a;}
.n>.row.cur{background:#8a45fa99;}
.chev{flex:0 0 18px;width:18px;text-align:center;color:var(--muted);cursor:pointer;font-size:10px;}
.chev.leaf{visibility:hidden;}
.k{color:#c9b6ff;margin-right:6px;}
.hint{color:var(--muted);margin-left:8px;}
.v-s{color:#9fe3a7;} .v-n{color:#f5b942;} .v-b{color:#ff8fa3;} .v-z{color:var(--muted);}
.kids{margin-left:18px;display:none;border-left:1px solid #ffffff10;padding-left:4px;}
.n.open>.kids{display:block;}
.more{color:var(--accent);cursor:pointer;padding-left:18px;}
#audBox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;}
#wave{width:min(900px,92%);height:140px;background:var(--card);border-radius:16px;cursor:pointer;}
audio{width:min(900px,92%);}
#glCv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;}
#glCv.drag{cursor:grabbing;}
</style>
</head>
<body>
<div id="top">
  <div id="title"><div id="name">Loading...</div><div id="sub"></div></div>
  <div class="grow"></div>
  <div id="tools" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"></div>
  <div class="sep"></div>
  <button class="btn" id="bSave">Save As...</button>
  <button class="btn" id="bShow">Show in Folder</button>
</div>
<div id="stage">
  <div id="loading"><div class="ring"></div><div style="color:var(--muted);font-size:13px">Loading the asset from the game files...</div></div>
  <div id="fail"><h3 id="failT">Could not preview this</h3><p id="failP"></p></div>
</div>
<div id="bar"></div>

<script>
const $ = id => document.getElementById(id)
const utf8 = b => new TextDecoder().decode(b)
const fmtBytes = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB'
let SET = {}

function setBar(items) {
  $('bar').innerHTML = ''
  items.filter(Boolean).forEach(t => { const s = document.createElement('span'); s.textContent = t; $('bar').appendChild(s) })
}
function btn(label, onclick, cls) {
  const b = document.createElement('button')
  b.className = 'btn' + (cls ? ' ' + cls : '')
  b.textContent = label
  b.onclick = onclick
  $('tools').appendChild(b)
  return b
}
function sepTool() { const d = document.createElement('div'); d.className = 'sep'; $('tools').appendChild(d) }
function fail(title, text) {
  $('loading').style.display = 'none'
  $('failT').textContent = title
  $('failP').textContent = text
  $('fail').style.display = 'flex'
}

/* ---------------- image */
async function viewImage(job) {
  const bytes = await pv.read(job.file)
  if (!bytes) return fail('Could not read the image', job.file)
  const bmp = await createImageBitmap(new Blob([bytes], { type: 'image/png' }))
  const W = bmp.width, H = bmp.height
  const tmp = document.createElement('canvas')
  tmp.width = W; tmp.height = H
  const tctx = tmp.getContext('2d', { willReadFrequently: true })
  tctx.drawImage(bmp, 0, 0)
  const src = tctx.getImageData(0, 0, W, H)
  const stage = $('stage')
  const wrap = document.createElement('div')
  wrap.id = 'imgWrap'
  wrap.className = SET.previewBg === 'dark' ? 'dark' : 'checker'
  const cv = document.createElement('canvas')
  cv.id = 'imgCv'
  cv.width = W; cv.height = H
  wrap.appendChild(cv)
  stage.appendChild(wrap)
  $('loading').style.display = 'none'
  const ctx = cv.getContext('2d')
  const ch = { r: true, g: true, b: true, a: true }
  let z = 1, x = 0, y = 0
  function draw() {
    if (ch.r && ch.g && ch.b && ch.a) { ctx.putImageData(src, 0, 0); return }
    const out = ctx.createImageData(W, H)
    const s = src.data, o = out.data
    const onlyA = ch.a && !ch.r && !ch.g && !ch.b
    for (let i = 0; i < s.length; i += 4) {
      if (onlyA) { o[i] = o[i + 1] = o[i + 2] = s[i + 3]; o[i + 3] = 255; continue }
      o[i] = ch.r ? s[i] : 0
      o[i + 1] = ch.g ? s[i + 1] : 0
      o[i + 2] = ch.b ? s[i + 2] : 0
      o[i + 3] = ch.a ? s[i + 3] : 255
    }
    ctx.putImageData(out, 0, 0)
  }
  let hover = ''
  function info() { setBar([W + ' x ' + H, Math.round(z * 100) + '%', fmtBytes(bytes.length) + ' PNG', hover]) }
  function place() {
    cv.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + z + ')'
    cv.style.imageRendering = z >= 2 ? 'pixelated' : 'auto'
    info()
  }
  function fit() {
    const r = stage.getBoundingClientRect()
    z = Math.min(r.width / W, r.height / H) * 0.94
    x = (r.width - W * z) / 2; y = (r.height - H * z) / 2
    place()
  }
  function one() {
    const r = stage.getBoundingClientRect()
    z = 1; x = (r.width - W) / 2; y = (r.height - H) / 2
    place()
  }
  const chips = {}
  ;['r', 'g', 'b', 'a'].forEach(k => {
    chips[k] = btn(k.toUpperCase(), () => { ch[k] = !ch[k]; chips[k].classList.toggle('on', ch[k]); draw() }, 'chip ' + k + ' on')
  })
  sepTool()
  btn('Fit', fit)
  btn('1:1', one)
  btn('Background', () => { wrap.className = wrap.className === 'checker' ? 'dark' : 'checker' })
  wrap.addEventListener('wheel', e => {
    e.preventDefault()
    const r = stage.getBoundingClientRect()
    const px = e.clientX - r.left, py = e.clientY - r.top
    const nz = Math.max(0.02, Math.min(64, z * Math.exp(-e.deltaY * 0.0015)))
    x = px - (px - x) * nz / z; y = py - (py - y) * nz / z; z = nz
    place()
  }, { passive: false })
  let drag = null
  wrap.addEventListener('pointerdown', e => { drag = { sx: e.clientX, sy: e.clientY, x, y }; wrap.setPointerCapture(e.pointerId); wrap.classList.add('drag') })
  wrap.addEventListener('pointerup', () => { drag = null; wrap.classList.remove('drag') })
  wrap.addEventListener('pointermove', e => {
    if (drag) { x = drag.x + e.clientX - drag.sx; y = drag.y + e.clientY - drag.sy; place(); return }
    const r = stage.getBoundingClientRect()
    const ix = Math.floor((e.clientX - r.left - x) / z), iy = Math.floor((e.clientY - r.top - y) / z)
    if (ix >= 0 && iy >= 0 && ix < W && iy < H) {
      const i = (iy * W + ix) * 4, d = src.data
      hover = 'x ' + ix + '  y ' + iy + '   rgba ' + d[i] + ', ' + d[i + 1] + ', ' + d[i + 2] + ', ' + d[i + 3]
    } else hover = ''
    info()
  })
  wrap.addEventListener('dblclick', fit)
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase()
    if (k === 'f') fit()
    else if (k === '1') one()
    else if (chips[k]) chips[k].click()
  })
  draw(); fit()
}

/* ---------------- json */
async function viewJson(job) {
  const bytes = await pv.read(job.file)
  if (!bytes) return fail('Could not read the file', job.file)
  const text = utf8(bytes)
  let data
  try { data = JSON.parse(text) } catch (e) { data = undefined }
  $('loading').style.display = 'none'
  const box = document.createElement('div')
  box.id = 'jsonBox'
  box.innerHTML = '<div id="jTools"><input id="jSearch" type="text" spellcheck="false" placeholder="Search keys and values  (Enter = next, Shift+Enter = previous)"><span id="jCount"></span></div><div id="jTree"></div><pre id="jRaw"></pre>'
  $('stage').appendChild(box)
  const tree = $('jTree'), raw = $('jRaw')
  raw.textContent = text
  const LIMIT = 400
  function kind(v) { return v === null ? 'null' : Array.isArray(v) ? 'array' : typeof v }
  function makeNode(key, val) {
    const n = document.createElement('div')
    n.className = 'n'
    const row = document.createElement('div')
    row.className = 'row'
    const chev = document.createElement('span')
    chev.className = 'chev'
    const k = document.createElement('span')
    k.className = 'k'
    k.textContent = key === null ? '' : key + ':'
    row.appendChild(chev); row.appendChild(k)
    n.appendChild(row)
    n.row = row
    n.kids = new Map()
    const t = kind(val)
    if (t === 'object' || t === 'array') {
      const keys = Object.keys(val)
      const sum = document.createElement('span')
      sum.className = 'v-z'
      sum.textContent = t === 'array' ? '[' + keys.length + ']' : '{' + keys.length + '}'
      row.appendChild(sum)
      if (t === 'object' && val.Type && val.Name) {
        const h = document.createElement('span'); h.className = 'hint'; h.textContent = String(val.Type) + '  ' + String(val.Name); row.appendChild(h)
      } else if (t === 'object' && typeof val.Name === 'string') {
        const h = document.createElement('span'); h.className = 'hint'; h.textContent = val.Name; row.appendChild(h)
      }
      if (!keys.length) chev.className = 'chev leaf'
      const holder = document.createElement('div')
      holder.className = 'kids'
      n.appendChild(holder)
      let built = 0
      function build(upTo) {
        const end = Math.min(keys.length, upTo)
        const old = holder.querySelector(':scope > .more')
        if (old) old.remove()
        for (; built < end; built++) {
          const kk = keys[built]
          const child = makeNode(kk, val[kk])
          n.kids.set(kk, child)
          holder.appendChild(child)
        }
        if (built < keys.length) {
          const m = document.createElement('div')
          m.className = 'more'
          m.textContent = '... ' + (keys.length - built) + ' more (click to show)'
          m.onclick = () => build(built + 2000)
          holder.appendChild(m)
        }
      }
      n.expand = () => { if (!built && keys.length) build(LIMIT); n.classList.add('open'); chev.textContent = '▾' }
      n.collapse = () => { n.classList.remove('open'); chev.textContent = '▸' }
      n.showAll = () => build(keys.length)
      n.ensure = kk => { if (!n.kids.has(kk)) { n.expand(); n.showAll() } return n.kids.get(kk) }
      chev.textContent = '▸'
      const toggle = () => n.classList.contains('open') ? n.collapse() : n.expand()
      chev.onclick = toggle
      row.ondblclick = toggle
    } else {
      chev.className = 'chev leaf'
      const s = document.createElement('span')
      if (t === 'string') { s.className = 'v-s'; s.textContent = JSON.stringify(val) }
      else if (t === 'number') { s.className = 'v-n'; s.textContent = String(val) }
      else if (t === 'boolean') { s.className = 'v-b'; s.textContent = String(val) }
      else { s.className = 'v-z'; s.textContent = 'null' }
      row.appendChild(s)
    }
    return n
  }
  const tabs = [btn('Tree', () => show(true), 'on'), btn('Raw', () => show(false))]
  function show(isTree) {
    tree.style.display = isTree ? '' : 'none'
    raw.style.display = isTree ? 'none' : 'block'
    tabs[0].classList.toggle('on', isTree); tabs[1].classList.toggle('on', !isTree)
  }
  sepTool()
  btn('Copy', async () => { await pv.copy(text); setBar(['Copied ' + fmtBytes(text.length)]) })
  if (data === undefined) {
    show(false)
    setBar(['Could not parse as JSON, showing the raw text'])
    return
  }
  const rootNode = makeNode(null, data)
  tree.appendChild(rootNode)
  rootNode.expand()
  if (rootNode.kids.size === 1) { const only = rootNode.kids.values().next().value; if (only.expand) only.expand() }
  btn('Expand', () => {
    let budget = 3000
    const go = (node, d) => {
      if (!node.expand || budget <= 0 || d > 3) return
      node.expand(); budget -= node.kids.size
      node.kids.forEach(c => go(c, d + 1))
    }
    go(rootNode, 0)
  })
  btn('Collapse', () => { rootNode.kids.forEach(c => c.collapse && c.collapse()); rootNode.expand() })
  let matches = [], cur = -1, curRow = null
  function find(term) {
    matches = []; cur = -1
    if (!term) { $('jCount').textContent = ''; return }
    const t = term.toLowerCase()
    const stack = [[data, []]]
    while (stack.length && matches.length < 2000) {
      const [v, p] = stack.pop()
      const kd = kind(v)
      if (kd === 'object' || kd === 'array') {
        const keys = Object.keys(v)
        for (let i = keys.length - 1; i >= 0; i--) stack.push([v[keys[i]], p.concat([keys[i]])])
        if (p.length && kd !== 'array' && String(p[p.length - 1]).toLowerCase().includes(t)) matches.push(p)
      } else {
        const last = p.length ? String(p[p.length - 1]).toLowerCase() : ''
        if (last.includes(t) || String(v).toLowerCase().includes(t)) matches.push(p)
      }
    }
    $('jCount').textContent = matches.length ? '0 / ' + matches.length + (matches.length >= 2000 ? '+' : '') : 'No matches'
  }
  function go(dir) {
    if (!matches.length) return
    cur = (cur + dir + matches.length) % matches.length
    let node = rootNode
    for (const seg of matches[cur]) { node.expand(); node = node.ensure(seg); if (!node) return }
    if (curRow) curRow.classList.remove('cur')
    curRow = node.row; curRow.classList.add('cur')
    curRow.scrollIntoView({ block: 'center' })
    $('jCount').textContent = (cur + 1) + ' / ' + matches.length + (matches.length >= 2000 ? '+' : '')
  }
  let ft = null
  $('jSearch').addEventListener('input', e => { clearTimeout(ft); ft = setTimeout(() => { find(e.target.value.trim()); go(1) }, 250) })
  $('jSearch').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(e.shiftKey ? -1 : 1) } })
  window.addEventListener('keydown', e => { if (e.ctrlKey && e.key.toLowerCase() === 'f') { e.preventDefault(); $('jSearch').focus() } })
  setBar([fmtBytes(bytes.length), Array.isArray(data) ? data.length + ' exports' : Object.keys(data).length + ' keys', 'Ctrl+F to search'])
}

/* ---------------- audio */
function parseWav(bytes) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength)
  if (bytes.length < 44 || dv.getUint32(0, false) !== 0x52494646 || dv.getUint32(8, false) !== 0x57415645) return null
  let pos = 12, fmt = null, dataAt = -1, dataLen = 0
  while (pos + 8 <= bytes.length) {
    const id = dv.getUint32(pos, false), len = dv.getUint32(pos + 4, true)
    if (id === 0x666d7420) fmt = { tag: dv.getUint16(pos + 8, true) === 0xfffe && len >= 26 ? dv.getUint16(pos + 32, true) : dv.getUint16(pos + 8, true), ch: dv.getUint16(pos + 10, true), rate: dv.getUint32(pos + 12, true), bits: dv.getUint16(pos + 22, true) }
    else if (id === 0x64617461) { dataAt = pos + 8; dataLen = Math.min(len, bytes.length - dataAt); break }
    pos += 8 + len + (len & 1)
  }
  if (!fmt || dataAt < 0 || !fmt.ch || !fmt.rate) return null
  const bps = fmt.bits >> 3
  if (![1, 2, 3, 4].includes(bps) || (fmt.tag !== 1 && fmt.tag !== 3)) return null
  const frames = Math.floor(dataLen / (bps * fmt.ch))
  const out = new Float32Array(frames)
  const float = fmt.tag === 3
  for (let i = 0; i < frames; i++) {
    const o = dataAt + i * bps * fmt.ch
    let v
    if (float && bps === 4) v = dv.getFloat32(o, true)
    else if (bps === 1) v = (dv.getUint8(o) - 128) / 128
    else if (bps === 2) v = dv.getInt16(o, true) / 32768
    else if (bps === 3) v = ((dv.getUint8(o + 2) << 24 | dv.getUint8(o + 1) << 16 | dv.getUint8(o) << 8) >> 8) / 8388608
    else v = dv.getInt32(o, true) / 2147483648
    out[i] = v
  }
  return { data: out, duration: frames / fmt.rate, channels: fmt.ch, rate: fmt.rate }
}

async function viewAudio(job) {
  const bytes = await pv.read(job.file)
  if (!bytes) return fail('Could not read the file', job.file)
  const ext = job.file.split('.').pop().toLowerCase()
  const mime = { ogg: 'audio/ogg', opus: 'audio/ogg; codecs=opus', wav: 'audio/wav', mp3: 'audio/mpeg', flac: 'audio/flac', m4a: 'audio/mp4' }[ext] || 'application/octet-stream'
  const url = URL.createObjectURL(new Blob([bytes], { type: mime }))
  $('loading').style.display = 'none'
  const box = document.createElement('div')
  box.id = 'audBox'
  box.innerHTML = '<canvas id="wave"></canvas><audio id="aud" controls></audio>'
  $('stage').appendChild(box)
  const au = $('aud')
  au.src = url
  try { const st = await pv.settings(); au.volume = st.volume == null ? 1 : Math.max(0, Math.min(1, st.volume)); if (st.audioDevice && au.setSinkId) await au.setSinkId(st.audioDevice) } catch (e) {}
  const cv = $('wave')
  let peaks = null
  function paint() {
    const w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1
    cv.width = w * dpr; cv.height = h * dpr
    const c = cv.getContext('2d')
    c.scale(dpr, dpr)
    c.clearRect(0, 0, w, h)
    if (peaks) {
      c.fillStyle = '#8a45fa'
      const mid = h / 2
      for (let i = 0; i < w; i++) {
        const p = peaks[Math.floor(i / w * peaks.length)] || 0
        c.fillRect(i, mid - p * mid * 0.95, 1, Math.max(1, p * h * 0.95))
      }
    } else {
      c.fillStyle = '#8a869b'; c.font = '13px sans-serif'; c.textAlign = 'center'
      c.fillText('Waveform not available for this format', w / 2, h / 2)
    }
    if (au.duration) { c.fillStyle = '#ffffffcc'; c.fillRect(au.currentTime / au.duration * w, 0, 2, h) }
  }
  try {
    let d, duration, channels, rate
    const wav = ext === 'wav' ? parseWav(bytes) : null
    if (wav) {
      d = wav.data; duration = wav.duration; channels = wav.channels; rate = wav.rate
    } else {
      const ac = new (window.AudioContext || window.webkitAudioContext)()
      const buf = await ac.decodeAudioData(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength))
      d = buf.getChannelData(0); duration = buf.duration; channels = buf.numberOfChannels; rate = buf.sampleRate
      ac.close()
    }

const M4 = {

async function loadGltf(file) {
  const bytes = await pv.read(file)

  const buffers = await Promise.all((json.buffers || []).map(async b => b.uri === undefined ? bin : await fromUri(b.uri)))
  return { json, buffers, fromUri }
}

function accessor(g, idx, asIndex) {
  const a = g.json.accessors[idx], bv = g.json.bufferViews[a.bufferView]

  const CT = { 5120: Int8Array, 5121: Uint8Array, 5122: Int16Array, 5123: Uint16Array, 5125: Uint32Array, 5126: Float32Array }[a.componentType]
  const bp = CT.BYTES_PER_ELEMENT

  const stride = bv.byteStride || comps * bp

  const norm = a.normalized ? { 5120: 127, 5121: 255, 5122: 32767, 5123: 65535 }[a.componentType] : 0

}

  const bTex = btn('Textures', () => { st.tex = !st.tex; sync(); draw() })
  const bGrid = btn('Grid', () => { st.grid = !st.grid; sync(); draw() })

/* ---------------- main */
async function main() {
  try { SET = (await pv.settings()) || {} } catch (e) {}
  if (SET.accent) document.documentElement.style.setProperty('--accent', SET.accent)
  const job = await pv.job()
  $('name').textContent = job.name || 'Preview'
  $('sub').textContent = job.path || ''
  document.title = 'Preview - ' + (job.name || '')
  const hasFile = job.ok && job.file
  $('bSave').disabled = !hasFile
  $('bShow').disabled = !hasFile
  $('bSave').onclick = () => pv.saveAs(job.file)
  $('bShow').onclick = () => pv.reveal(job.file)
  if (!job.ok) return fail('Could not preview this', job.error || 'unknown error')
  if (job.note) setBar([job.note])
  try {
    if (job.kind === 'texture') await viewImage(job)
    else if (job.kind === 'model') await viewModel(job)
    else if (job.kind === 'sound') await viewAudio(job)
    else await viewJson(job)
  } catch (e) { fail('The viewer hit an error', String(e && e.message || e)) }
}
window.addEventListener('keydown', e => { if (e.key === 'Escape') window.close() })
main()
</script>
</body>
</html>
