<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Sound Viewer</title>
<style>
head,style,script,title,meta,link{display:none !important;}
@font-face{font-family:'SF Pro Text';font-weight:400;src:url('../assets/fonts/SF-Pro-Text-Regular.otf');}
@font-face{font-family:'SF Pro Text';font-weight:600;src:url('../assets/fonts/SF-Pro-Text-Semibold.otf');}
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0D0C12;--btn:#1D1B24;--btn-hover:#252332;--sel:#252332;--sel-hover:#2E2B3C;--text:#E2DFF0;--muted:#A8A4C0;--accent:#953bf8;--shadow:inset 0 3px 2px -2px #ffffff10,inset 0 10px 25px #ffffff05,inset 0 0 0 1.5px #ffffff0a,0 4px 8px #00000020,0 8px 12px #00000010;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'SF Pro Text','Segoe UI',system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;overflow:hidden;user-select:none;box-shadow:inset 0 0 0 1px #3D3C42;}
button{font-family:inherit;outline:none;border:none;color:inherit;background:none;}
#tb{flex:0 0 35px;height:35px;position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;-webkit-app-region:drag;}
#tb .logo{justify-self:end;width:20px;height:20px;margin-right:6px;}
#tb .ttl{font-weight:600;font-size:14px;}
.winctl{position:absolute;top:0;right:1px;display:flex;-webkit-app-region:no-drag;}
.winctl button{width:35px;height:35px;display:flex;align-items:center;justify-content:center;color:#b9b5c9;cursor:pointer;border-radius:4px;}
.winctl button:hover{background:#ffffff0a;color:#fff;}
.winctl .wc-close:hover{background:#FF0022;color:#fff;}
#row{flex:1;min-height:0;display:flex;align-items:center;gap:8px;padding:0 9px 3px 10px;}
#play{flex:0 0 auto;width:38px;height:32px;border-radius:16px;background:var(--btn);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);}
#play:hover{background:var(--btn-hover);}
#play:active{background:#232130;}
#play:disabled{opacity:.5;cursor:default;}
.tm{flex:0 0 auto;font-size:14px;min-width:42px;font-variant-numeric:tabular-nums;}
#sl{flex:1;min-width:0;position:relative;height:20px;display:flex;align-items:center;}
#sl input{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;outline:none;margin:0;cursor:pointer;--pr:0;}
#sl input::-webkit-slider-runnable-track{height:4px;border-radius:0;background:radial-gradient(circle at 4px 2px,var(--accent) 0 1.6px,transparent 2.1px),radial-gradient(circle at calc(100% - 4px) 2px,#959599 0 1.6px,transparent 2.1px),linear-gradient(to right,transparent 0 4px,var(--accent) 4px calc(11px + (100% - 22px) * var(--pr)),#959599 calc(11px + (100% - 22px) * var(--pr)) calc(100% - 4px),transparent calc(100% - 4px));}
#sl input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0,var(--accent) 5px,var(--btn) 5.6px);box-shadow:var(--shadow);}
#sl input:hover::-webkit-slider-thumb{background:radial-gradient(circle,var(--accent) 0,var(--accent) 6px,var(--btn-hover) 6.6px);}
#sl input:active::-webkit-slider-thumb{background:radial-gradient(circle,var(--accent) 0,var(--accent) 4px,var(--btn) 4.6px);}
#err{flex:1;min-width:0;font-size:13px;color:#f5b942;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none;user-select:text;}
</style>
</head>
<body>
<div id="tb"><img class="logo" src="../assets/logo.png"><div class="ttl">Sound Viewer</div><div></div>
  <div class="winctl">
    <button id="wMin"><svg width="15" height="15" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    <button id="wMax"><svg id="wMaxIc" width="18" height="18" viewBox="0 0 12 12" fill="none"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.2" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button id="wClose" class="wc-close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
  </div>
</div>
<div id="row">
  <button id="play" title="Play"></button>
  <span class="tm" id="cur">00:00</span>
  <div id="sl"><input id="seek" type="range" min="0" max="0" step="any" value="0"></div>
  <span id="err"></span>
  <span class="tm" id="tot" style="text-align:right">00:00</span>
</div>
<script>
const $ = id => document.getElementById(id)
const PLAY = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg>'
const PAUSE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M14,19H18V5H14M6,19H10V5H6V19Z"/></svg>'
const au = new Audio()
let seeking = false
let curUrl = ''
let token = 0
let SET = {}

function applyTheme(s) {
  const t = (s && s.theme) || {}
  const r = document.documentElement.style
  const map = { accent: '--accent', btn: '--btn', btnHover: '--btn-hover', bg: '--bg', text: '--text', muted: '--muted', sel: '--sel', selHover: '--sel-hover' }
  Object.keys(map).forEach(k => { if (typeof t[k] === 'string' && /^#[0-9a-fA-F]{6,8}$/.test(t[k])) r.setProperty(map[k], t[k]) })
}
const fmt = s => {
  s = Math.max(0, Math.floor(isFinite(s) ? s : 0))
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0')
}
function icon() { $('play').innerHTML = au.paused ? PLAY : PAUSE; $('play').title = au.paused ? 'Play' : 'Pause' }
function paint() {
  const d = isFinite(au.duration) ? au.duration : 0
  const c = au.currentTime || 0
  $('tot').textContent = fmt(d)
  if (!seeking) {
    $('cur').textContent = fmt(c)
    $('seek').max = d
    $('seek').value = c
    $('seek').style.setProperty('--pr', d ? c / d : 0)
  }
}
function showError(text) {
  $('err').textContent = text
  $('err').style.display = 'block'
  $('sl').style.display = 'none'
}
function clearError() { $('err').style.display = 'none'; $('sl').style.display = 'flex' }

async function playItem(p) {
  const my = ++token
  clearError()
  au.pause()
  paint(); icon()
  const job = await pv.multiJob(p.id)
  if (my !== token) return
  if (!job.ok || job.kind !== 'sound') return showError(job.note || job.error || 'Could not play this sound')
  const bytes = await pv.read(job.file)
  if (my !== token) return
  if (!bytes) return showError('Could not read ' + job.file)
  const ext = job.file.split('.').pop().toLowerCase()
  const mime = { ogg: 'audio/ogg', opus: 'audio/ogg; codecs=opus', wav: 'audio/wav', mp3: 'audio/mpeg', flac: 'audio/flac', m4a: 'audio/mp4' }[ext] || 'application/octet-stream'
  const url = URL.createObjectURL(new Blob([bytes], { type: mime }))
  if (curUrl) URL.revokeObjectURL(curUrl)
  curUrl = url
  au.src = url
  try { au.volume = SET.volume == null ? 1 : Math.max(0, Math.min(1, SET.volume)) } catch (e) {}
  try { await au.play() } catch (e) { if (my === token) { icon(); showError('This player cannot play .' + ext + ' files') } }
  if (my === token) { paint(); icon() }
}

$('play').onclick = () => {
  if (!au.src) return
  if (au.paused) {
    if (au.ended || (isFinite(au.duration) && au.currentTime >= au.duration)) au.currentTime = 0
    au.play().catch(() => {})
  } else au.pause()
}
au.onplay = au.onpause = au.onended = icon
au.ontimeupdate = paint
au.onloadedmetadata = paint
au.ondurationchange = paint
au.onerror = () => showError('This player cannot play this file')
setInterval(() => { if (!au.paused) paint() }, 33)
const sk = $('seek')
sk.oninput = () => {
  seeking = true
  const d = isFinite(au.duration) ? au.duration : 0
  const v = Number(sk.value)
  $('cur').textContent = fmt(v)
  sk.style.setProperty('--pr', d ? v / d : 0)
  if (d) au.currentTime = v
}
sk.onchange = () => { seeking = false; paint() }
sk.onpointerup = () => { seeking = false }

$('wMin').onclick = () => pv.win.minimize()
$('wMax').onclick = () => pv.win.toggleMaximize()
$('wClose').onclick = () => pv.win.close()
const MAX_IC = '<rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.2" stroke="currentColor" stroke-width="1.3"/>'
const RESTORE_IC = '<path d="M4 2.2h5a1.4 1.4 0 0 1 1.4 1.4v5M2.2 4.3h5.1a.9.9 0 0 1 .9.9v5.1a.9.9 0 0 1-.9.9H3.1a.9.9 0 0 1-.9-.9V5.2a.9.9 0 0 1 .9-.9z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>'

async function main() {
  icon()
  try { SET = (await pv.settings()) || {}; applyTheme(SET); if (SET.audioDevice && au.setSinkId) await au.setSinkId(SET.audioDevice) } catch (e) {}
  const latest = list => list.length && playItem(list[list.length - 1])
  pv.onAdd(p => playItem(p))
  latest(await pv.multiInit())
}
main()
</script>
</body>
</html>
