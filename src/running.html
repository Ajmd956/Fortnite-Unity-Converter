<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Fortnite Unity Converter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#09080d;--border:#27243a;--cyan:#8a45fa;--text:#f2f0f7;--muted:#8a869b;--warn:#f5b942;}
body{
  height:100vh;background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:24px;user-select:none;overflow:hidden;
}
.logo{width:84px;height:84px;filter:drop-shadow(0 0 22px #8e22eb55);animation:in .7s cubic-bezier(.22,1,.36,1) both;}
.name{margin-top:18px;font-size:16px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;}
.name b{color:var(--cyan);font-weight:800;}
.err{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:360px;animation:up .5s ease .3s both;}
h3{font-size:17px;font-weight:800;color:var(--warn);letter-spacing:.04em;}
p{font-size:12px;color:var(--muted);line-height:1.6;}
button{
  margin-top:12px;padding:10px 26px;background:var(--cyan);border:none;border-radius:8px;color:#fff;
  font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.05em;cursor:pointer;
  transition:transform .12s ease,opacity .15s ease,box-shadow .15s ease;
}
button:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 16px #8a45fa33;}
button:active{transform:scale(.96);}
@keyframes in{from{opacity:0;transform:scale(.8);}to{opacity:1;transform:scale(1);}}
@keyframes up{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<img class="logo" src="../assets/logo.png" alt="" draggable="false">
<div class="name">Fortnite <b>Unity</b> Converter</div>
<div class="err">
  <h3 id="t"></h3>
  <p>Looks like an instance of this is already running?</p>
  <button id="ok">OK</button>
</div>
<script>
const TITLES = [
  'Uh-oh, we hit a roadblock!',
  "Oops! That didn't fit right.",
  'Hold up, something went sideways.',
  'Nobody home!',
  'Storm surge! Connection lost.',
  'Whoops, missed the landing.'
]
document.getElementById('t').textContent = TITLES[Math.floor(Math.random() * TITLES.length)]
document.getElementById('ok').onclick = () => window.close()
</script>
</body>
</html>
